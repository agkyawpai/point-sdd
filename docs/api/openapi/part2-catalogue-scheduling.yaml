openapi: 3.1.0
info:
  title: Point Barbershop API — Part 2 · Catalogue & Scheduling
  version: 1.4.0
  summary: Service categories, services, options / variants, effective-dated prices + quote, eligibility, schedule patterns / shifts, leave, availability
  description: 'Design document for Part 2 (docs/api/02-catalogue-scheduling.md). Conventions: docs/api/00-conventions.md (v1.5).

    Decisions served: D-SVC-01..08, D-EMP-05, D-SCH-01..03, D-LV-01..05, D-BKG-04..08/19/22/23, D-WEB-01/04, D-DB-03/04/06, D-PLT-15/16, D-DAT-05.

    Status: LOCKED v1.4 = D-API-03 (02/Oct/2026 — owner one-sheet "အကုန်လုံး OK" 02/Oct/2026 00:06 + Part 4 / 5 / 8 amendments: priceQuote date window = any branch date that is not CLOSED (late entry — owner B11; closed past date -> 422 day_closed); shift writes inside a finalized payroll period -> 423 payroll_finalized (Part 5 PayrollLock) and attendance re-detection on shift / leave writes touching today or a past date; review fixes 02/Oct (no version bump): 423 payroll_finalized also on leaveCreate / leaveApprove / leaveReject, 422 self_action on an own shift write (or own pattern save) changing a date <= today (reconcile 02/Oct: 422, not 403), category_in_use { count }, schedule.changed payload { branch_id?, employee_id?, dates }; leaveCreate look-back for Part 5 create_leave; availability ignores late-entry visits as busy time, several in-progress visits each count (owner B1); image_attachment_id = staging upload via Attachments.replace, image_url = stable media path (Part 8 research E9)). Fix-up 02/Oct (batch v5.2.15, no version bump): 423 payroll_finalized context = Part 5 { employee_id, run_id, period: { start, end }, status }; leave.requested / leave.decided / leave.cancelled named as notification types (Part 8 §15; leave.cancelled as locked in v1.3). v1.3 (owner scope choice A — ADR-012: categories / service master / options / order / archive / leave types = company master -> company scope to write (branch scope = read-only, 403 company_scope_required); per-branch sale + duration (serviceBranchesSet) = branch data checked per item; service.view / service.update are mixed). Locked v1.2 = D-API-03 (owner 01/Oct/2026 21:20 — decision sheet #16-#24 all at the defaults; DB Part 2 v1.3 locked = D-DB-06 v1.3). v1.2 = permission codes CRUD per menu + special actions (ADR-011) — 22 codes; x-permission on every operation ("<module>.view+" = view or any other code of the module; "any staff (read scope)" = operational read, no code — P2-RULE-11). v1.1 = independent review fixes + verification pass (§17 of the design). Generated-from-code OpenAPI must match this file.

    Every operation that requires the session cookie may also return 401 (unauthenticated / session_revoked) and 503 (maintenance for non-admins); omitted per operation for brevity.

    Conventions reminders: money = integer MMK; timestamps ISO 8601 with +06:30; dates = MMT business dates; status/type = smallint codes (D-DB-03); bilingual *_mm / *_en (D-DB-04); errors = RFC 9457 problem+json
    with code = language key (API-ERR-01); lists cursor-paginated (API-DATA-08); availability and quote responses are never cached.

    '
servers:
- url: /api/v1
  description: Same origin as the web app — Caddy routes /api/* to NestJS (ADR-009); staff host app.<domain> (★ ACT-05)
- url: http://localhost:3000/api/v1
  description: Local development through the dev Caddy
tags:
- name: categories
  description: Service categories — D-SVC-01
- name: services
  description: Company master services, branch sale / duration, website fields — D-SVC-01/02/07, D-WEB-01
- name: options
  description: Pricing option groups, values, generated variants — D-SVC-05, D-DB-06
- name: prices
  description: Effective-dated price store and the price quote — D-SVC-03/04/05/06/08
- name: eligibility
  description: Employee × branch × service eligibility, home_allowed — D-EMP-05, D-BKG-22
- name: schedule
  description: Weekly patterns, generated / manual shifts, roster, conflicts — D-SCH-01..03, D-BKG-19
- name: leave
  description: Leave types and leave requests — D-LV-01..05
- name: availability
  description: The one availability function — D-BKG-04..08/23, D-SCH-03, D-LV-04
security:
- sessionCookie: []
paths:
  /service-categories:
    get:
      tags:
      - categories
      operationId: categoryList
      summary: List service categories (P2.CAT.01)
      x-permission: 'any staff (read scope); include_archived=true -> service.view+'
      parameters:
      - name: status
        in: query
        schema:
          type: array
          items:
            type: integer
            enum:
            - 0
            - 1
        description: repeatable; default 1
        style: form
        explode: true
      - name: include_archived
        in: query
        schema:
          type: boolean
          default: false
      - name: include_counts
        in: query
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Category'
        '401': &id001
          $ref: '#/components/responses/Unauthenticated'
    post:
      tags:
      - categories
      operationId: categoryCreate
      summary: Create a category (P2.CAT.02) — service.create
      x-permission: 'service.create (company master: company scope)'
      parameters:
      - $ref: '#/components/parameters/XRequestedWith'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
          headers:
            Location:
              schema:
                type: string
        '400': &id002
          $ref: '#/components/responses/ValidationError'
        '401': *id001
        '403': &id003
          $ref: '#/components/responses/Forbidden'
        '409': &id004
          $ref: '#/components/responses/Conflict'
  /service-categories/order:
    put:
      tags:
      - categories
      operationId: categoryReorder
      summary: Reorder categories (P2.CAT.05) — service.update
      x-permission: 'service.update (company master: company scope)'
      parameters:
      - $ref: '#/components/parameters/XRequestedWith'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - ids
              properties:
                ids:
                  type: array
                  items: &id006
                    type: string
                    format: uuid
                  minItems: 1
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Category'
        '400': *id002
        '401': *id001
        '403': *id003
  /service-categories/{id}:
    patch:
      tags:
      - categories
      operationId: categoryUpdate
      summary: Update a category (P2.CAT.03) — service.update
      x-permission: 'service.update (company master: company scope)'
      parameters:
      - $ref: '#/components/parameters/XRequestedWith'
      - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryUpdate'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '400': *id002
        '401': *id001
        '403': *id003
        '404': &id005
          $ref: '#/components/responses/NotFound'
        '409': *id004
  /service-categories/{id}/archive:
    post:
      tags:
      - categories
      operationId: categoryArchive
      summary: Archive a category (P2.CAT.04) — service.delete; 409 category_in_use { count }
      x-permission: 'service.delete (company master: company scope)'
      parameters:
      - $ref: '#/components/parameters/XRequestedWith'
      - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '401': *id001
        '403': *id003
        '404': *id005
        '409': *id004
  /services:
    get:
      tags:
      - services
      operationId: serviceList
      summary: List services (P2.SVC.01) — any staff; sold=all / include_archived=true need service.view+
      x-permission: 'any staff (read scope); include_archived=true -> service.view+; sold=all -> service.view+ for a branch_id the grant covers (ADR-012)'
      parameters:
      - name: q
        in: query
        schema:
          type: string
          maxLength: 100
      - name: category_id
        in: query
        schema: *id006
      - name: branch_id
        in: query
        schema: *id006
        description: Only services sold at this branch (ACTIVE branch_services)
      - name: pricing_mode
        in: query
        schema:
          type: integer
          enum:
          - 1
          - 2
      - name: status
        in: query
        schema:
          type: array
          items:
            type: integer
            enum:
            - 0
            - 1
        description: repeatable; default 1
        style: form
        explode: true
      - name: include_archived
        in: query
        schema:
          type: boolean
          default: false
      - name: sold
        in: query
        schema:
          type: string
          enum:
          - here
          - all
          default: here
        description: all (service.view+) = every service with a sold_here flag for the Branches tab
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceListPage'
        '400': *id002
        '401': *id001
    post:
      tags:
      - services
      operationId: serviceCreate
      summary: Create a service with branches and options (P2.SVC.02) — service.create
      x-permission: 'service.create (company master: company scope)'
      description: 'v1.4: image_attachment_id = a staging image from POST /v1/attachments (Part 8), linked with Attachments.replace (422 attachment_invalid); image_url = the stable media path /api/v1/public/media/<attachment_id>/original (Part 8 research E9).'
      parameters:
      - $ref: '#/components/parameters/XRequestedWith'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Service'
          headers:
            Location:
              schema:
                type: string
        '400': *id002
        '401': *id001
        '403': *id003
        '409': *id004
        '422': &id007
          $ref: '#/components/responses/Unprocessable'
  /services/order:
    put:
      tags:
      - services
      operationId: serviceReorder
      summary: Reorder services within a category (P2.SVC.07) — service.update
      x-permission: 'service.update (company master: company scope)'
      parameters:
      - $ref: '#/components/parameters/XRequestedWith'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - category_id
              - ids
              properties:
                category_id: *id006
                ids:
                  type: array
                  items: *id006
                  minItems: 1
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ServiceListItem'
        '400': *id002
        '401': *id001
        '403': *id003
  /services/{id}:
    get:
      tags:
      - services
      operationId: serviceGet
      summary: Service detail with branches, options, variants, website fields (P2.SVC.03)
      x-permission: 'any staff (read scope)'
      parameters:
      - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Service'
        '401': *id001
        '404': *id005
    patch:
      tags:
      - services
      operationId: serviceUpdate
      summary: Update details / website fields / status (P2.SVC.04) — service.update
      x-permission: 'service.update (company master: company scope)'
      description: 'v1.4: image_attachment_id as serviceCreate — the previous image is soft-deleted by the system, null removes it (422 attachment_invalid).'
      parameters:
      - $ref: '#/components/parameters/XRequestedWith'
      - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceUpdate'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Service'
                - type: object
                  properties:
                    warnings:
                      type: array
                      items:
                        $ref: '#/components/schemas/Warning'
        '400': *id002
        '401': *id001
        '403': *id003
        '404': *id005
        '409': *id004
        '422': *id007
  /services/{id}/archive:
    post:
      tags:
      - services
      operationId: serviceArchive
      summary: Archive a service (P2.SVC.05) — service.delete; references in bookings / sales stay (D-DAT-05)
      x-permission: 'service.delete (company master: company scope)'
      parameters:
      - $ref: '#/components/parameters/XRequestedWith'
      - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Service'
                - type: object
                  properties:
                    warnings:
                      type: array
                      items:
                        $ref: '#/components/schemas/Warning'
        '401': *id001
        '403': *id003
        '404': *id005
  /services/{id}/branches:
    put:
      tags:
      - services
      operationId: serviceBranchesSet
      summary: Set where the service is sold and its duration per branch (P2.SVC.06) — service.update
      x-permission: 'service.update (branch data: every item''s branch_id must be covered by the caller''s service.update scope, else 403 out_of_scope — ADR-012)'
      parameters:
      - $ref: '#/components/parameters/XRequestedWith'
      - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - items
              properties:
                items:
                  type: array
                  items:
                    type: object
                    required:
                    - branch_id
                    - sold
                    - duration_minutes
                    properties:
                      branch_id: *id006
                      sold:
                        type: boolean
                      duration_minutes:
                        type: integer
                        minimum: 1
                        maximum: 1440
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Service'
                - type: object
                  properties:
                    warnings:
                      type: array
                      items:
                        $ref: '#/components/schemas/Warning'
        '400': *id002
        '401': *id001
        '403': *id003
        '404': *id005
        '422': *id007
  /services/{id}/options:
    get:
      tags:
      - options
      operationId: serviceOptionsGet
      summary: Option groups, values and generated variants (P2.OPT.01)
      x-permission: 'any staff (read scope)'
      parameters:
      - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OptionsView'
        '401': *id001
        '404': *id005
    put:
      tags:
      - options
      operationId: serviceOptionsSet
      summary: Replace option groups / values; variants regenerated; on a SIMPLE service switches it to OPTIONS (P2.OPT.02) — service.update
      x-permission: 'service.update (company master: company scope)'
      parameters:
      - $ref: '#/components/parameters/XRequestedWith'
      - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OptionsSet'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/OptionsView'
                - type: object
                  properties:
                    warnings:
                      type: array
                      items:
                        $ref: '#/components/schemas/Warning'
        '400': *id002
        '401': *id001
        '403': *id003
        '404': *id005
        '409': *id004
        '422': *id007
  /services/{id}/variants:
    get:
      tags:
      - options
      operationId: serviceVariantsResolved
      summary: Variant cells with the effective price at a branch / location (P2.OPT.03)
      x-permission: 'any staff (read scope)'
      parameters:
      - $ref: '#/components/parameters/Id'
      - name: branch_id
        in: query
        schema: *id006
        required: true
      - name: location_type
        in: query
        schema:
          type: integer
          enum:
          - 1
          - 2
          default: 1
      - name: as_of
        in: query
        schema: &id008
          type: string
          format: date
          description: MMT business date YYYY-MM-DD (D-PLT-15)
        description: default today
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/VariantCell'
        '400': *id002
        '401': *id001
        '404': *id005
  /services/{id}/prices:
    get:
      tags:
      - prices
      operationId: priceGridGet
      summary: Price grid effective on a date plus scheduled grids (P2.PRC.01) — price.view+
      x-permission: 'price.view+'
      parameters:
      - $ref: '#/components/parameters/Id'
      - name: branch_id
        in: query
        schema: *id006
        required: true
      - name: location_type
        in: query
        schema:
          type: integer
          enum:
          - 1
          - 2
          default: 1
      - name: as_of
        in: query
        schema: *id008
        description: default today
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceGrid'
        '400': *id002
        '401': *id001
        '404': *id005
    put:
      tags:
      - prices
      operationId: priceGridSet
      summary: Write a price grid effective from a date (P2.PRC.02) — price.update (branch scope)
      x-permission: 'price.update'
      description: 'D-SVC-03/05/06/08, P2-RULE-03/04. Replaces the whole grid for the branch / location from effective_from: a cell absent or with price_amount null = not sold (BRANCH) / use shop price
        (HOME). 409 price_overlap from the DB EXCLUDE; 422 not_sold_here · variant_not_of_service · override_not_allowed · effective_date_past.'
      parameters:
      - $ref: '#/components/parameters/XRequestedWith'
      - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PriceGridWrite'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/PriceGrid'
                - type: object
                  properties:
                    warnings:
                      type: array
                      items:
                        $ref: '#/components/schemas/Warning'
        '400': *id002
        '401': *id001
        '403': *id003
        '404': *id005
        '409': *id004
        '422': *id007
  /services/{id}/prices/history:
    get:
      tags:
      - prices
      operationId: priceHistory
      summary: Price history rows (P2.PRC.03) — price.view+; D-SVC-08
      x-permission: 'price.view+'
      parameters:
      - $ref: '#/components/parameters/Id'
      - name: branch_id
        in: query
        schema: *id006
        required: true
      - name: location_type
        in: query
        schema:
          type: integer
          enum:
          - 1
          - 2
      - name: service_variant_id
        in: query
        schema: *id006
      - name: employee_id
        in: query
        schema: *id006
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceRowPage'
        '400': *id002
        '401': *id001
        '404': *id005
  /services/{id}/prices/copy:
    post:
      tags:
      - prices
      operationId: priceGridCopy
      summary: Copy today's grid from one branch to another as a dated write (P2.PRC.04) — price.update
      x-permission: 'price.update'
      parameters:
      - $ref: '#/components/parameters/XRequestedWith'
      - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - from_branch_id
              - to_branch_id
              - location_type
              - effective_from
              properties:
                from_branch_id: *id006
                to_branch_id: *id006
                location_type:
                  type: integer
                  enum:
                  - 1
                  - 2
                effective_from: *id008
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/PriceGrid'
                - type: object
                  properties:
                    warnings:
                      type: array
                      items:
                        $ref: '#/components/schemas/Warning'
        '400': *id002
        '401': *id001
        '403': *id003
        '404': *id005
        '409': *id004
        '422': *id007
  /services/{id}/prices/withdraw:
    post:
      tags:
      - prices
      operationId: priceGridWithdraw
      summary: Withdraw a scheduled (not yet effective) grid (P2.PRC.05) — price.delete; 422 grid_effective
      x-permission: 'price.delete'
      parameters:
      - $ref: '#/components/parameters/XRequestedWith'
      - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - branch_id
              - location_type
              - effective_from
              properties:
                branch_id: *id006
                location_type:
                  type: integer
                  enum:
                  - 1
                  - 2
                effective_from: *id008
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceGrid'
        '400': *id002
        '401': *id001
        '403': *id003
        '404': *id005
        '422': *id007
  /prices/quote:
    post:
      tags:
      - prices
      operationId: priceQuote
      summary: Price quote for items at a branch / location / date / barber (P2.PRC.06) — the only price calculator (D-SVC-04)
      x-permission: 'any staff (read scope)'
      description: 'Pure read (POST for the body). complete=false with per-item sold=false and reason instead of 422. Cache-Control: no-store. v1.4 (owner B11): date = any earlier business date of the branch that is not CLOSED (late entry — no fixed look-back) up to today + advance window; a later date -> 422 outside_window; a past date whose branch-day is CLOSED (Part 7 daily_closings) -> 422 day_closed (context.correction_path = reopen).'
      parameters:
      - $ref: '#/components/parameters/XRequestedWith'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuoteRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quote'
        '400': *id002
        '401': *id001
        '403': *id003
        '404': *id005
        '422': *id007
  /branches/{id}/eligibilities:
    get:
      tags:
      - eligibility
      operationId: eligibilityMatrixGet
      summary: Eligibility matrix for a branch (P2.ELG.01) — eligibility.view+; D-EMP-05
      x-permission: 'eligibility.view+'
      parameters:
      - $ref: '#/components/parameters/Id'
      - name: as_of
        in: query
        schema: *id008
        description: default today
      - name: service_id
        in: query
        schema: *id006
      - name: employee_id
        in: query
        schema: *id006
      responses:
        '200':
