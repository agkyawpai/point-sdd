components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: point_session
      description: Server-side session (user_sessions.token_hash) — D-AUTH-06. Mutating requests also need X-Requested-With (API-AUTH-02).
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: *id006
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
      description: Opaque cursor from next_cursor
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    XRequestedWith:
      name: X-Requested-With
      in: header
      required: true
      schema:
        type: string
        enum:
        - point-app
      description: CSRF guard for cookie-authenticated mutations (API-AUTH-02)
  responses:
    ValidationError:
      description: 400 validation (errors[] per field)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthenticated:
      description: 401 unauthenticated · session_revoked
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: 403 forbidden · out_of_scope · company_scope_required (ADR-012) · csrf
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: 404 not_found (also out-of-scope single reads)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: 409 already_exists · category_in_use { count } · leave_type_in_use · price_overlap · shift_overlap · leave_overlap · conflict
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unprocessable:
      description: 422 business rule — codes in docs/api/02-catalogue-scheduling.md §13b (incl. self_action — a shift write or pattern save changing the own shifts of the caller on a date <= today; owner C11, reconcile 02/Oct)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Locked:
      description: '423 payroll_finalized { employee_id, run_id, period: { start, end }, status } (context = Part 5 P5-RULE-10 PayrollLock, Part 0 API-IDEM-06 — leave create / edit / approve / reject / cancel and shift writes touching a finalized payroll period; review fix 02/Oct)'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    RateLimited:
      description: 429 rate_limited
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Maintenance:
      description: 503 maintenance (non-admins)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Problem:
      type: object
      required:
      - title
      - status
      - code
      - request_id
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        code:
          type: string
          example: cross_branch_gap
        detail:
          type: string
        errors:
          type: array
          items:
            type: object
            required:
            - field
            - code
            properties:
              field:
                type: string
                example: days[2].segments[1]
              code:
                type: string
              params:
                type: object
                additionalProperties: true
        request_id:
          type: string
          format: uuid
          description: Server-generated UUIDv7 (API-ERR-01)
        context:
          type: object
          additionalProperties: true
          description: Machine data a code needs (API-ERR-01 v1.4), e.g. day_closed -> branch_id, business_date, correction_path
      additionalProperties: true
      description: RFC 9457 problem details; code = language key error.*
    Warning:
      type: object
      required:
      - code
      properties:
        code:
          type: string
          example: bookings_outside_shift
        params:
          type: object
          additionalProperties: true
        items:
          type: array
          items:
            type: object
            additionalProperties: true
    Category:
      type: object
