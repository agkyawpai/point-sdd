      x-permission: cashout.return (branch data — the returning drawer body.branch_id, default the cash out branch)
      description: 'P7-RULE-11 — day lock (returning branch + date) first, then the cash out row FOR UPDATE. Response = CashOut, or CashOutReduced when the caller has no cashout.view+
        on the cash out branch. 422 not_must_return · return_exceeds_outstanding { outstanding_amount } · day_closed · date_in_future · idempotency_mismatch; 409 invalid_transition (cancelled
        cash out). Already converted → reversal expense (source 6, negative, original branch) in the same transaction. Identifying fields: cash_out_id, amount.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: The MUST_RETURN cash out
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/XRequestedWith'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CashReturnCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/CashOut'
                - $ref: '#/components/schemas/CashOutReduced'
                description: 'CashOut when the caller holds cashout.view+ for the cash out branch (or is its recorder / taker); otherwise CashOutReduced (reduced: true) — P7-RULE-11'
        '200':
          description: Idempotent replay (same Idempotency-Key, same identifying fields)
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/CashOut'
                - $ref: '#/components/schemas/CashOutReduced'
                description: 'CashOut when the caller holds cashout.view+ for the cash out branch (or is its recorder / taker); otherwise CashOutReduced (reduced: true) — P7-RULE-11'
          headers:
            Idempotent-Replayed:
              schema:
                type: boolean
              description: true on a replay of the same Idempotency-Key (API-IDEM-02)
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
