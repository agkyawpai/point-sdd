                  maxLength: 1000
              required:
              - reason
              description: Reason (400 reason_required when empty)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManualIncome'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /manual-incomes/{id}/attachments:
    post:
      tags:
      - manual-incomes
      operationId: incomeAttach
      summary: Add receipts to a manual income (P7.INC.08)
      x-permission: income.update (branch data / company-wide -> company scope) or self (requester)
      description: As P7.EXP.08 — deleted → 409 invalid_transition; 422 attachment_invalid { attachment_id, reason }.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/XRequestedWith'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                attachment_ids:
                  type: array
                  items:
                    type: string
                    format: uuid
                  minItems: 1
                  maxItems: 10
                  description: Staging uploads (ADR-014 — POST /v1/attachments) re-pointed to this row by Part 8 Attachments.link (422 attachment_invalid)
              required:
              - attachment_ids
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManualIncome'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /pnl:
    get:
      tags:
      - pnl
      operationId: pnlGet
      summary: Monthly P&L — branch or company (P7.PNL.01) — 🔒 D-FIN-05/09, owner E6 / F6
      x-permission: pnl.view (mixed — branch P&L = branch data; company P&L = company scope)
      description: 'P7-RULE-17 — live (ADR-015): revenue = FINISHED sales lines net of discount + service charge − kind-1 refunds on the refund date (F6) + APPROVED manual incomes; tax
        excluded; expenses APPROVED by category with reversal rows labelled + note; SALARY = one total line (detail only for company-scope payroll.view — owner E6 / C1); completeness
        notes.'
      parameters:
      - name: month
        in: query
        schema:
          type: string
          pattern: ^\d{4}-(0[1-9]|1[0-2])$
          description: YYYY-MM (MMT calendar month)
        description: Required; a future month → 422 date_in_future
        required: true
      - name: branch_id
        in: query
        schema:
          type: array
          items:
            type: string
            format: uuid
        description: Repeatable — these branches combined (each covered by the grant, else 403 out_of_scope; company-wide rows never included). Omitted = company P&L (company scope —
          403 company_scope_required)
        style: form
        explode: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PnlReport'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /pnl/trend:
    get:
      tags:
      - pnl
      operationId: pnlTrend
      summary: P&L trend by month (P7.PNL.02) — dashboard tile, report ⑥
      x-permission: pnl.view (mixed — as P7.PNL.01)
      parameters:
      - name: from_month
        in: query
        schema:
          type: string
          pattern: ^\d{4}-(0[1-9]|1[0-2])$
          description: YYYY-MM (MMT calendar month)
        required: true
      - name: to_month
        in: query
        schema:
          type: string
          pattern: ^\d{4}-(0[1-9]|1[0-2])$
          description: YYYY-MM (MMT calendar month)
        description: '≤ 12 months including from_month (422 range_too_long { max_days: 366 } — 12 whole months, the ADR-015 cap)'
        required: true
      - name: branch_id
        in: query
        schema:
          type: array
          items:
            type: string
            format: uuid
        description: Repeatable — these branches combined (each covered by the grant, else 403 out_of_scope; company-wide rows never included). Omitted = company P&L (company scope —
          403 company_scope_required)
        style: form
        explode: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PnlTrend'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: point_session
      description: Server-side session — D-AUTH-06. Mutating requests also need X-Requested-With (API-AUTH-02).
  parameters:
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
      description: Opaque cursor from next_cursor
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    XRequestedWith:
      name: X-Requested-With
      in: header
      required: true
      schema:
        type: string
        enum:
        - point-app
      description: CSRF guard for cookie-authenticated mutations (API-AUTH-02)
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
      description: client_request_id — one UUID per logical submit, kept across retries (API-IDEM-01 v1.5, 🔒 D-VIS-10, sheet G (d)); stored on cash_outs / cash_returns / expenses / manual_incomes.client_request_id;
        missing → 400 idempotency_key_required
  responses:
    ValidationError:
      description: 400 validation · reason_required (errors[].field) · idempotency_key_required
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthenticated:
      description: 401 unauthenticated · session_revoked
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: 403 forbidden (context.required names the missing code — also receivable.issue for edit / cancel of an EMPLOYEE_BALANCE cash out) · out_of_scope · company_scope_required
        (company-wide rows, company P&L, company master, purchase-expense delete — ADR-012) · csrf
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: 404 not_found (unknown id, out-of-scope single read, company-wide / SALARY rows outside the caller's level)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: 409 invalid_transition (also a repeated reopen) · conflict (expected_updated_at; a row whose date changed between read and lock) · open_sales_exist · previous_day_open
        · closing_changed · cash_out_has_returns · cash_out_converted · reason_in_use · category_in_use · system_row · already_exists · idempotency_in_progress · receivable_in_use (Part
        5)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unprocessable:
      description: 422 business rule — codes in docs/api/07-finance-closing.md §12 (day_closed, date_in_future, range_too_long, reason_inactive, category_inactive, method_inactive, taker_required,
        reason_type_change, use_cancel, amount_below_returned, not_must_return, return_exceeds_outstanding, cash_income_requires_branch, self_approval, system_category_not_allowed, idempotency_mismatch,
        self_issue / employee_inactive from Part 5, attachment_invalid from Part 8)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Locked:
      description: 423 locked (CLOSED closing; APPROVED / automatic expense; APPROVED income — context.correction_path)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Problem:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        code:
          type: string
          description: Language key under error.* (API-ERR-01)
        detail:
          type: string
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              code:
                type: string
              params:
                type: object
                additionalProperties: true
        request_id:
          type: string
          format: uuid
          description: Server-generated UUIDv7 (API-ERR-01)
        context:
          type: object
          additionalProperties: true
          description: 'Machine data (API-ERR-01 v1.4): day_closed → { branch_id, business_date, closed_at, closed_by, correction_path: "reopen" } · open_sales_exist → { sales: [{ sale_id,
            visit_id, performer, started_at, is_late_entry, total_amount, paid_amount }] } · previous_day_open → { dates[] } · closing_changed → { expected_cash_amount, unverified_payment_count,
            components } · return_exceeds_outstanding → { outstanding_amount } · amount_below_returned → { returned_amount } · cash_out_has_returns → { count } · cash_out_converted →
            { expense_id } · reason_in_use → { cash_out_count } · category_in_use → { count } · system_category_not_allowed → { system_code } · locked → { locked_by, locked_at, correction_path
            } · invalid_transition → { status } · forbidden → { required } · range_too_long → { max_days } (92 closings list · 366 P&L trend = 12 whole months — same context as Part
            8) · attachment_invalid → { attachment_id, reason } (Part 8 Attachments.link)'
      required:
      - type
      - title
      - status
      - code
    Warning:
      type: object
      properties:
        code:
          type: string
          description: 'beyond_tolerance { difference_amount, tolerance_amount } · later_closings { dates[] } · pending_discount_requests { count } · pending_cash_incomes { count } ·
            previous_month_pnl { date } (same code and context as Part 6) · payroll_finalized_period { run_id, period: { start, end } } (reopen) · charged_to_expense { expense_id }'
        params:
          type: object
          additionalProperties: true
      required:
      - code
    ClosingDraft:
      type: object
      properties:
        opening_cash_amount:
          type: integer
          minimum: 0
          description: Whole MMK (D-PLT-04)
        opening_difference_reason:
          type:
          - string
          - 'null'
          maxLength: 1000
        counted_cash_amount:
          type:
          - integer
          - 'null'
          minimum: 0
        cash_difference_reason:
          type:
          - string
          - 'null'
          maxLength: 1000
        unverified_reason:
          type:
          - string
          - 'null'
          maxLength: 1000
        notes:
          type:
          - string
          - 'null'
          maxLength: 2000
        expected_updated_at:
          type:
          - string
          - 'null'
          format: date-time
          description: updated_at the client last read (null / omitted when the row does not exist yet) — mismatch → 409 conflict
      required:
      - opening_cash_amount
      description: Saved as the OPEN draft (P7-RULE-05) — no business checks
    ClosingClose:
      type: object
      properties:
        opening_cash_amount:
          type: integer
          minimum: 0
          description: Whole MMK (D-PLT-04)
        opening_difference_reason:
          type:
          - string
          - 'null'
          maxLength: 1000
        counted_cash_amount:
          type: integer
          minimum: 0
          description: Cash counted in the drawer (after the takings handover Cash Out — owner E1)
        cash_difference_reason:
          type:
          - string
          - 'null'
          maxLength: 1000
        unverified_reason:
          type:
          - string
          - 'null'
          maxLength: 1000
        notes:
          type:
          - string
          - 'null'
          maxLength: 2000
        expected_cash_amount:
          type: integer
          description: The figure the closer saw (P7.CLS.02) — differs from the server → 409 closing_changed
        unverified_payment_count:
          type: integer
          minimum: 0
          description: The count the closer saw — differs → 409 closing_changed
        expected_updated_at:
          type:
          - string
          - 'null'
          format: date-time
          description: updated_at the client last read (null / omitted when the row does not exist yet) — mismatch → 409 conflict
      required:
      - opening_cash_amount
      - counted_cash_amount
      - expected_cash_amount
      - unverified_payment_count
    VerificationItem:
      type: object
      properties:
        payment_id:
          type: string
          format: uuid
        sale_id:
          type: string
          format: uuid
        receipt_number:
          type:
          - string
          - 'null'
        received_at:
          type: string
          format: date-time
        amount:
          type: integer
          minimum: 0
          description: Whole MMK (D-PLT-04)
        external_reference:
          type:
          - string
          - 'null'
        payment_method:
          type: object
          properties:
            id:
              type: string
              format: uuid
            code:
              type: string
            name_mm:
              type: string
            name_en:
              type:
              - string
              - 'null'
            is_cash:
              type: boolean
            requires_verification:
              type: boolean
          required:
          - id
          - code
          - name_mm
          - is_cash
        collected_by:
          type: object
          properties:
            id:
              type: string
              format: uuid
            display_name:
              type: string
          required:
          - id
          - display_name
        verified_at:
          type:
          - string
          - 'null'
          format: date-time
        verified_by:
          oneOf:
          - type: object
            properties:
              user_id:
                type: string
                format: uuid
              display_name:
                type: string
            required:
            - user_id
            - display_name
          - type: 'null'
        verified_after_close:
          type: boolean
          description: verified at or after closed_at (owner E3)
      required:
      - payment_id
      - sale_id
      - received_at
      - amount
      - payment_method
      - collected_by
      - verified_at
      - verified_after_close
      description: A payment whose EFFECTIVE method requires_verification (Part 4 EffectiveSale — contract 8); tick / untick = Part 4 P4.PAY.05 / 06
    OpenSale:
      type: object
      properties:
        sale_id:
          type: string
          format: uuid
        visit_id:
          type:
          - string
          - 'null'
          format: uuid
        performer:
          oneOf:
          - type: object
            properties:
              id:
                type: string
                format: uuid
              display_name:
                type: string
            required:
            - id
            - display_name
          - type: 'null'
        started_at:
          type:
          - string
          - 'null'
          format: date-time
        is_late_entry:
          type: boolean
        total_amount:
          type: integer
          minimum: 0
          description: Whole MMK (D-PLT-04)
        paid_amount:
          type: integer
          minimum: 0
          description: Whole MMK (D-PLT-04)
      required:
      - sale_id
      - is_late_entry
      - total_amount
      - paid_amount
      description: 'An OPEN sale that blocks the close (owner E2): today — every OPEN sale incl. difference sales; a past date — an OPEN late-entry sale dated on or before it, or an
        OPEN sale holding non-voided payments received on or before it'
    CashRefundLine:
      type: object
      properties:
        refund_id:
          type: string
          format: uuid
        refund_receipt_number:
          type: string
        kind:
          type: integer
          enum:
          - 1
          - 2
          description: 1 SALE_REFUND · 2 OVERPAYMENT_RETURN (automatic change — Part 4 owner B5)
        amount:
          type: integer
          minimum: 0
          description: Whole MMK (D-PLT-04)
        refunded_at:
          type: string
          format: date-time
      required:
      - refund_id
      - refund_receipt_number
      - kind
      - amount
      - refunded_at
    DailyClosing:
      type: object
      properties:
        branch_id:
          type: string
          format: uuid
        business_date:
          type: string
          format: date
        exists:
          type: boolean
          description: false = no row yet (live preview only)
        status:
          type: integer
          enum:
          - 1
          - 2
          description: 1 OPEN (not closed / reopened) · 2 CLOSED (immutable snapshot — 🔒 D-FIN-06)
        source:
          type: string
          enum:
          - live
          - snapshot
          description: live = computed now (no row / OPEN) · snapshot = stored at close (CLOSED — F-P7-06)
        needs_closing:
          type: boolean
          description: P7-RULE-03
        opening:
          type: object
          properties:
            opening_cash_amount:
              type: integer
              minimum: 0
              description: Whole MMK (D-PLT-04)
            prefill_amount:
              type: integer
              minimum: 0
              description: closing.opening_float_amount (branch override → company default 0 — OPEN-05 A)
            previous_closing:
              oneOf:
              - type: object
                properties:
                  business_date:
                    type: string
                    format: date
                  counted_cash_amount:
                    type: integer
                    minimum: 0
                    description: Whole MMK (D-PLT-04)
                required:
                - business_date
                - counted_cash_amount
              - type: 'null'
            matches_previous:
              type:
              - boolean
              - 'null'
              description: null when there is no previous closing
            opening_difference_reason:
              type:
              - string
              - 'null'
          required:
          - opening_cash_amount
          - prefill_amount
          - previous_closing
          - matches_previous
          - opening_difference_reason
        components:
          type: object
          properties:
            cash_sales_amount:
              type: integer
              minimum: 0
              description: Whole MMK (D-PLT-04)
            cash_sales_count:
              type: integer
            cash_refunds_amount:
              type: integer
              minimum: 0
              description: Whole MMK (D-PLT-04)
            cash_outs_amount:
              type: integer
              minimum: 0
              description: Whole MMK (D-PLT-04)
            cash_returns_amount:
              type: integer
              minimum: 0
              description: Whole MMK (D-PLT-04)
            cash_manual_incomes_amount:
              type: integer
              minimum: 0
              description: PENDING + APPROVED cash incomes (owner E7)
          required:
          - cash_sales_amount
          - cash_sales_count
          - cash_refunds_amount
          - cash_outs_amount
          - cash_returns_amount
          - cash_manual_incomes_amount
          description: REC-17 components (🔒 D-FIN-06 — formula = DB CHECK, owner E8)
        expected_cash_amount:
          type: integer
          description: opening + sales − refunds − outs + returns + manual cash income
        counted_cash_amount:
          type:
          - integer
          - 'null'
          minimum: 0
        cash_difference_amount:
          type:
          - integer
          - 'null'
          description: counted − expected (DB generated column); null while counted is empty
        cash_difference_reason:
          type:
          - string
          - 'null'
        tolerance_amount:
          type: integer
          minimum: 0
          description: closing.cash_difference_tolerance_amount (company, default 0)
        difference_state:
          type:
          - string
          - 'null'
          enum:
          - balanced
          - within_tolerance
          - beyond_tolerance
          - null
          description: null while counted is empty · balanced = 0 · within / beyond closing.cash_difference_tolerance_amount
        noncash:
          type: object
          properties:
            expected_amount:
              type: integer
              minimum: 0
              description: Whole MMK (D-PLT-04)
            verified_amount:
              type: integer
              minimum: 0
              description: Whole MMK (D-PLT-04)
            unverified_payment_count:
              type: integer
            verified_after_close_count:
              type: integer
              description: CLOSED only — ticked after closed_at (owner E3); 0 otherwise
            unverified_now_count:
              type: integer
              description: Live count still unticked
            items:
              type: array
              items:
                $ref: '#/components/schemas/VerificationItem'
          required:
          - expected_amount
          - verified_amount
          - unverified_payment_count
          - verified_after_close_count
          - unverified_now_count
          - items
        unverified_reason:
          type:
          - string
          - 'null'
        movements:
          type: object
          properties:
            cash_outs:
              type: array
              items:
                $ref: '#/components/schemas/CashOutListItem'
            cash_returns:
              type: array
              items:
                $ref: '#/components/schemas/CashReturn'
            cash_incomes:
              type: array
              items:
                $ref: '#/components/schemas/ManualIncomeListItem'
            cash_refunds:
              type: array
              items:
                $ref: '#/components/schemas/CashRefundLine'
          required:
          - cash_outs
          - cash_returns
          - cash_incomes
          - cash_refunds
          description: 'Each line links to its record (AD-CLS-01 #2); cash sales drill down to Part 4 lists. EMPLOYEE_BALANCE cash outs keep amount + reason; their taker is masked unless
            company-scope payroll.view or receivable.issue (P7-RULE-01 — owner C1 + D-FIN-06)'
        checks:
          type: object
          properties:
            open_sales:
              type: array
              items:
                $ref: '#/components/schemas/OpenSale'
              description: Blocker (owner E2)
            previous_open_dates:
              type: array
              items:
                type: string
                format: date
              description: Blocker — earlier dates that need closing and are not CLOSED
            pending_discount_requests:
              type: integer
              description: Warning (AD-CLS-05)
            pending_cash_incomes:
              type: integer
              description: Info — already counted, awaiting approval (owner E7)
          required:
          - open_sales
          - previous_open_dates
          - pending_discount_requests
          - pending_cash_incomes
        notes:
          type:
          - string
          - 'null'
        closed_at:
          type:
          - string
          - 'null'
          format: date-time
        closed_by:
          oneOf:
          - type: object
            properties:
              user_id:
                type: string
                format: uuid
              display_name:
                type: string
            required:
            - user_id
            - display_name
          - type: 'null'
        reopen_count:
          type: integer
        last_reopened_at:
          type:
          - string
          - 'null'
          format: date-time
        last_reopened_by:
          oneOf:
          - type: object
            properties:
              user_id:
                type: string
                format: uuid
              display_name:
                type: string
            required:
            - user_id
            - display_name
          - type: 'null'
        last_reopen_reason:
          type:
          - string
          - 'null'
        actions:
          type: object
          properties:
            can_save:
              type: boolean
            can_close:
              type: boolean
            can_reopen:
              type: boolean
            can_verify:
              type: boolean
          required:
          - can_save
          - can_close
          - can_reopen
          - can_verify
          description: What the caller may do now (AD-PERM-02)
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/Warning'
        updated_at:
          type:
          - string
          - 'null'
          format: date-time
      required:
      - branch_id
      - business_date
      - exists
      - status
      - source
      - needs_closing
      - opening
      - components
      - expected_cash_amount
      - counted_cash_amount
      - cash_difference_amount
      - tolerance_amount
      - difference_state
      - noncash
      - movements
      - checks
      - reopen_count
      - actions
      - warnings
    ClosingListItem:
      type: object
      properties:
        branch_id:
          type: string
          format: uuid
        business_date:
          type: string
          format: date
        exists:
          type: boolean
        status:
          type: integer
          enum:
