openapi: 3.1.0
info:
  title: Point Barbershop API — Part 7 · Finance & Daily Closing
  version: 1.1.0
  summary: Daily closing (preview, count, close, reopen), cash outs and returns, cash-out reasons, expense / income categories, expenses, manual incomes, P&L
  description: 'Design document for Part 7 (docs/api/07-finance-closing.md). Conventions: docs/api/00-conventions.md (v1.5 — incl. the idempotency wording of contract 15).

    v1.1 (02/Oct/2026) — OPEN-40 locked (owner "OPEN-40 OK"): (a) Expenses.removePayroll(run, actor, reason) soft-deletes the run''s source-3 salary expenses (deleted_at, deleted_by
    = the actor, deletion_reason "Payroll reopened — <reason>"); DB Part 7 v1.2 = FK expenses.payroll_entry_branch_allocation_id ON DELETE SET NULL + expenses_source_refs_chk accepts
    a NULL allocation on source 3 only when deleted_at IS NOT NULL; the next finalize posts fresh rows. No endpoint, DTO or code changed — description strings only.

    Decisions served: D-FIN-01..09 (REC-15/16/17, OPEN-05 A, OPEN-25), D-PAY-02 (REC-11), D-VIS-07/13, D-SVC-06, D-PAYR-04/08, D-DSH-01/02, D-RPT-01 ⑤ ⑥, D-NTF-01..03, D-AUD-01/02, D-DAT-05,
    D-ROLE-02/03/07/09 (ADR-011, ADR-012 + contract 1 amendment), D-DB-11 (F-P7-01..07), D-PLT-15/16.

    Status: 🔒 LOCKED v1.1 — D-API-08 (owner one-sheet "အကုန်လုံး OK", 02/Oct/2026 00:06 — E1–E8, C2–C4, D1, D3, F6, F12, G (d), H (4); v1.1 = owner "OPEN-40 OK", 02/Oct/2026 — (a)).
    DB Part 7 v1.2 (v1.1 = cash_outs / cash_returns cancelled_at, cancelled_by_user_id, cancel_reason; expenses / manual_incomes client_request_id; v1.2 = expenses allocation FK ON
    DELETE SET NULL + expenses_source_refs_chk for soft-deleted payroll rows).

    x-permission on every operation: "<module>.view+" = view or any other code of the module (API-PERM-06); "any staff (read scope)" = operational read, no code; "self" = own rows; levels
    per ADR-012: closings, cash outs / returns, branch expenses / incomes, branch P&L = branch data; company-wide expenses / incomes (branch_id null) and the company P&L = company scope
    for read and write (contract 1); SALARY-category expense rows = private (company-scope payroll.view); reasons and categories = company master.

    DayLock (P7-RULE-02): drawer writes on a CLOSED branch-day → 422 day_closed (context.correction_path = "reopen"); KBZPay verification (Part 4) is exempt (owner E3), unverify is gated.

    v1.0 (02/Oct, batch consistency pass — no version bump): Expenses.removePayroll(run, actor, reason) raised as OPEN-40 (owner — answered in v1.1: soft delete + DB Part 7
    v1.2; no API change); Expenses.createAuto / postPayroll signatures shared with Parts 6 / 5; DayLock caller list = Part 4; Receivables.issue / cancelForCashOut
    / updateForCashOut; attachment_invalid from Part 8. Fix-up 02/Oct (batch v5.2.15): staff-advance taker private — EMPLOYEE_BALANCE cash outs keep amount + reason, employee / note
    / receivable_id only for company-scope payroll.view or receivable.issue (employee_hidden — owner C1 + D-FIN-06, P7-RULE-01); range_too_long { max_days }.

    Every staff operation may also return 401 and 503 (maintenance); mutating operations need X-Requested-With: point-app (API-AUTH-02). Idempotency-Key is required on cash outs, cash
    returns, expenses and manual incomes (client_request_id); save / close / approve / reject / delete / cancel are idempotent by state (repeat → 200); reopen is by state too but a repeat
    answers 409 invalid_transition.

    Review fixes 02/Oct (independent review — no version bump): every write incl. close / reopen = READ COMMITTED with the locks first (close / reopen: exclusive day lock = first statement),
    REPEATABLE READ READ ONLY only for previews / reports; lock order = day lock → payroll lock → sale → visit → booking → payments → receipt counter → cash-out / closing rows → stock
    level rows; reopen inside a finalized payroll period = warning payroll_finalized_period; open_sales_exist covers difference sales and, for a past date, OPEN sales with earlier payments;
    opening-hours rows count from their updated_at date; EMPLOYEE_BALANCE edit / cancel need receivable.issue; reject writes the rejecter into approved_by / approved_at; cancel of a
    return the conversion was computed with → 409 cash_out_converted; job closing.month_end_must_return = daily 01:00 MMT, converting once the branch month is fully closed; cash-out
    edit replaces the source-2 expense; category_in_use { count }; previous_month_pnl { date }; CashOutReduced; 422 system_category_not_allowed; 422 attachment_invalid on the attachment
    endpoints; receivable.installment_amount ≥ 1.

    Reconcile 02/Oct (cross-part reconcile — no version bump): staff-advance taker visible to company-scope payroll.view or receivable.issue holders and to the employee; a cash-out note
    edit calls Part 5 Receivables.updateForCashOut; closures are archived while start_date ≥ today (P7-RULE-03 reference).

    Conventions reminders: money = integer MMK; timestamps ISO 8601 with +06:30; business dates MMT; status / type = smallint codes (D-DB-03); errors = RFC 9457 problem+json with code
    = language key.'
servers:
- url: /api/v1
  description: Same origin as the app — Caddy routes /api/* to NestJS (ADR-009)
- url: http://localhost:3000/api/v1
  description: Local development through the dev Caddy
tags:
- name: daily-closings
  description: Daily closing per branch and business date — D-FIN-06, D-PAY-02, owner E1–E3 / E8 (branch data)
- name: cash-outs
  description: Cash outs — D-FIN-07/08, owner E5 / C2 / C4 / D1 (branch data)
- name: cash-returns
  description: Cash returns and reversals — D-FIN-09, OPEN-25 (branch data — returning drawer)
- name: cash-out-reasons
  description: Cash-out reason master — D-FIN-08 (company master)
- name: expense-categories
  description: Expense categories — D-FIN-02, F-P7-01 (company master — module finance_category)
- name: income-categories
  description: Income categories — D-FIN-01 (company master — module finance_category)
- name: expenses
  description: Expenses — D-FIN-02/03/04/09, owner E4 / D3 (branch data; company-wide = company scope; salary rows private)
- name: manual-incomes
  description: Manual incomes — D-FIN-01/03, owner E4 / E7 (branch data; company-wide = company scope)
- name: pnl
  description: P&L — D-FIN-05/09, owner E6 / F6 (branch data / company scope)
security:
- sessionCookie: []
paths:
  /daily-closings:
    get:
      tags:
      - daily-closings
      operationId: closingList
      summary: Closings list / company view (P7.CLS.01) — AD-CLS-07, AD-DSH-04
      x-permission: closing.view+ (branch data — scope-filtered)
      description: 'One row per branch × date: stored rows (OPEN draft or CLOSED snapshot) + virtual rows (exists=false, status 1, figures null) for dates that need closing (P7-RULE-03).
        Sort -business_date, branch.'
      parameters:
      - name: branch_id
        in: query
        schema:
          type: array
          items:
            type: string
            format: uuid
        description: Repeatable; default every branch in the grant
        style: form
        explode: true
      - name: from
        in: query
        schema:
          type: string
          format: date
        description: Default today − 13 days
      - name: to
        in: query
        schema:
          type: string
          format: date
        description: 'Default today; range ≤ 92 days (422 range_too_long { max_days: 92 })'
      - name: status
        in: query
        schema:
          type: array
          items:
            type: integer
            enum:
            - 1
            - 2
            description: 1 OPEN (not closed / reopened) · 2 CLOSED (immutable snapshot — 🔒 D-FIN-06)
        description: Repeatable
        style: form
        explode: true
      - name: needs_closing
        in: query
        schema:
          type: boolean
        description: 'true = only dates that need closing (P7-RULE-03) — with status=1: "days not closed"'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ClosingListItem'
                  next_cursor:
                    type:
                    - string
                    - 'null'
                  total:
                    type:
                    - integer
                    - 'null'
                required:
                - items
                - next_cursor
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /daily-closings/{branch_id}/{business_date}:
    get:
      tags:
      - daily-closings
      operationId: closingGet
      summary: Closing preview / snapshot for one branch-day (P7.CLS.02) — AD-CLS-01..04
      x-permission: closing.view+ (branch data)
      description: 'P7-RULE-04: live figures for no row / OPEN (source=live), the stored snapshot for CLOSED (source=snapshot) + live verified_after_close_count / unverified_now_count
        (owner E3). KBZPay list (effective method requires_verification — contract 8), movements, checks (open_sales / previous_open_dates = blockers), opening prefill from closing.opening_float_amount.
        422 date_in_future; out of scope → 404.'
      parameters:
      - name: branch_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: The drawer's branch (branch data — ADR-012)
      - name: business_date
        in: path
        required: true
        schema:
          type: string
          format: date
        description: MMT business date (D-PLT-15); ≤ today
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyClosing'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
    put:
      tags:
      - daily-closings
      operationId: closingSave
      summary: Save the count (draft) (P7.CLS.03) — AD-WIZ-01
      x-permission: closing.close (branch data)
      description: P7-RULE-05 — creates the OPEN row on the first save (INSERT … ON CONFLICT DO NOTHING + FOR UPDATE); stores opening / counted / reasons / notes + recomputed components;
        previous_closing_counted_amount stays NULL until close. CLOSED → 423 locked (correction_path reopen); 409 conflict; 422 date_in_future. No business checks on a draft.
      parameters:
      - name: branch_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: The drawer's branch (branch data — ADR-012)
      - name: business_date
        in: path
        required: true
        schema:
          type: string
          format: date
        description: MMT business date (D-PLT-15); ≤ today
      - $ref: '#/components/parameters/XRequestedWith'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClosingDraft'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyClosing'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '423':
          $ref: '#/components/responses/Locked'
  /daily-closings/{branch_id}/{business_date}/close:
    post:
      tags:
      - daily-closings
      operationId: closingClose
      summary: Close the day (P7.CLS.04) — 🔒 D-FIN-06, owner E2 / E8
      x-permission: closing.close (branch data)
      description: 'P7-RULE-06 — idempotent by state (no Idempotency-Key; CLOSED → 200 current state). One READ COMMITTED transaction: the exclusive day lock is its first statement,
        every check and the figures come after it (never a REPEATABLE READ snapshot). 409 previous_day_open { dates[] } · 409 open_sales_exist { sales[] } (owner E2 — today: every OPEN
        sale incl. difference sales; a past date: OPEN late-entry sales dated on or before it and OPEN sales holding payments received on or before it) · 409 closing_changed (body expected_cash_amount
        / unverified_payment_count differ from the server figures — context has the new ones) · 400 reason_required (cash_difference_reason / unverified_reason / opening_difference_reason)
        · 422 date_in_future. Difference beyond tolerance → notification closing.difference + warnings[] beyond_tolerance.'
      parameters:
      - name: branch_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: The drawer's branch (branch data — ADR-012)
      - name: business_date
        in: path
        required: true
        schema:
          type: string
          format: date
        description: MMT business date (D-PLT-15); ≤ today
      - $ref: '#/components/parameters/XRequestedWith'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClosingClose'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyClosing'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /daily-closings/{branch_id}/{business_date}/reopen:
    post:
      tags:
      - daily-closings
      operationId: closingReopen
      summary: Reopen a closed day (P7.CLS.05) — 🔒 D-FIN-06 admin reopen
      x-permission: closing.reopen (branch data — Admin seed)
      description: 'P7-RULE-07 — READ COMMITTED, exclusive day lock first; not CLOSED → 409 invalid_transition (also a repeat: reopen is the one by-state action that does not answer
        200); status 1, reopen_count + 1, last_reopened_*; values kept as the draft; warnings[] later_closings { dates[] } · payroll_finalized_period { run_id, period } (a day inside
        a FINALIZED / PUBLISHED / PAID payroll period may be reopened — Part 4 still refuses late-entry START / FINISH with SERVICE lines there, 423 payroll_finalized); notification
        closing.reopened.'
      parameters:
      - name: branch_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: The drawer's branch (branch data — ADR-012)
      - name: business_date
        in: path
        required: true
        schema:
          type: string
          format: date
        description: MMT business date (D-PLT-15); ≤ today
      - $ref: '#/components/parameters/XRequestedWith'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  minLength: 1
                  maxLength: 1000
              required:
              - reason
              description: Reason (400 reason_required when empty)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyClosing'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /cash-outs:
    get:
      tags:
      - cash-outs
      operationId: cashOutList
      summary: Cash outs list (P7.CSO.01) — AD-FIN-01
      x-permission: cashout.view+ (branch data — scope-filtered); mine=true = self (recorded by me, taken by me, or an advance / loan paid to me — no code)
      description: 'Staff advance taker private (P7-RULE-01 — owner C1 + D-FIN-06): an EMPLOYEE_BALANCE cash out keeps amount, reason, dates and state for every reader (the cash count
        needs them); employee, note and receivable_id are returned only to company-scope payroll.view or receivable.issue holders (both private, Admin seed) and to the employee themself
        — others get null + employee_hidden: true (UI "Staff advance").'
      parameters:
      - name: branch_id
        in: query
        schema:
          type: array
          items:
            type: string
            format: uuid
        description: Repeatable
        style: form
        explode: true
      - name: from
        in: query
        schema:
          type: string
          format: date
      - name: to
        in: query
        schema:
          type: string
          format: date
      - name: accounting_type
        in: query
        schema:
          type: array
          items:
            type: integer
            enum:
            - 1
            - 2
            - 3
            - 4
            description: 1 EXPENSE (→ expenses source 2) · 2 EMPLOYEE_BALANCE (→ advance / loan, Part 5) · 3 CASH_MOVEMENT (no expense — bank, takings to owner, stock / salary paid from
              the drawer) · 4 MUST_RETURN (outstanding — D-FIN-09) — 🔒 D-FIN-08
        description: Repeatable
        style: form
        explode: true
      - name: reason_id
        in: query
        schema:
          type: string
          format: uuid
      - name: state
        in: query
        schema:
          type: array
          items:
            type: string
            enum:
            - done
            - outstanding
            - charged_to_expense
            - returned
            - cancelled
            description: done = types 1–3 · outstanding = MUST_RETURN not fully returned · charged_to_expense = converted at month end, still owed (D-FIN-09) · returned = fully returned
              · cancelled (owner E5)
        description: Repeatable
        style: form
        explode: true
      - name: employee_id
        in: query
        schema:
          type: string
          format: uuid
        description: EMPLOYEE_BALANCE cash outs of this employee — needs company-scope payroll.view or receivable.issue (else 403 forbidden — P7-RULE-01, owner C1 + D-FIN-06)
      - name: mine
        in: query
        schema:
          type: boolean
        description: true = cash outs I recorded, took (taken_by_user_id) or received as an advance / loan (employee_id = my employee) — self, no code
      - name: q
        in: query
        schema:
          type: string
        description: Note or taker name (never matches a hidden advance note)
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/CashOutListItem'
                  next_cursor:
                    type:
                    - string
                    - 'null'
                  total:
                    type:
                    - integer
                    - 'null'
                required:
                - items
                - next_cursor
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
      - cash-outs
      operationId: cashOutCreate
      summary: Record a cash out (P7.CSO.03) — 🔒 D-FIN-07/08, owner E1 / C2 / C4 / D1
      x-permission: cashout.create (branch data — body.branch_id); EMPLOYEE_BALANCE reason also receivable.issue (Part 5 — private, company scope — owner C1 / C2)
      description: 'P7-RULE-09 — DayLock on the occurred_at business date (422 day_closed); reason ACTIVE (422 reason_inactive); type fields (400 validation, 422 taker_required); EMPLOYEE_BALANCE
        → Part 5 Receivables.issue (422 self_issue / employee_inactive); EXPENSE → APPROVED expense source 2 in the same transaction (automatic source — APPROVED by DB CHECK, 🔒 F-P7-04;
        owner E4 governs manual entries only). Identifying fields for replay: branch_id, reason_id, amount (422 idempotency_mismatch).'
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/XRequestedWith'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CashOutCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CashOut'
        '200':
          description: Idempotent replay (same Idempotency-Key, same identifying fields)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CashOut'
          headers:
            Idempotent-Replayed:
              schema:
                type: boolean
              description: true on a replay of the same Idempotency-Key (API-IDEM-02)
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /cash-outs/to-be-returned:
    get:
      tags:
      - cash-outs
      operationId: cashOutToBeReturned
      summary: '"To be returned" list (P7.CSO.02) — AD-FIN-03, 🔒 D-FIN-09'
      x-permission: cashout.view+ (branch data — scope-filtered); mine=true = self (taken by me)
      description: MUST_RETURN, not cancelled, outstanding > 0 (incl. charged_to_expense) with returns nested; oldest first; age_days.
      parameters:
      - name: branch_id
        in: query
        schema:
          type: array
          items:
            type: string
            format: uuid
        description: Repeatable
        style: form
        explode: true
      - name: taken_by_user_id
        in: query
        schema:
          type: string
          format: uuid
      - name: mine
        in: query
        schema:
          type: boolean
        description: true = cash I took (self)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/CashOut'
                  totals:
                    type: object
                    properties:
                      outstanding_amount:
                        type: integer
                        minimum: 0
                        description: Whole MMK (D-PLT-04)
                      count:
                        type: integer
                    required:
                    - outstanding_amount
                    - count
                required:
                - items
                - totals
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /cash-outs/{id}:
    get:
      tags:
      - cash-outs
      operationId: cashOutGet
      summary: Cash out detail (P7.CSO.04)
      x-permission: cashout.view+ (branch data) or self (recorder / taker / the employee of an advance)
      description: 'Staff advance taker private (P7-RULE-01 — owner C1 + D-FIN-06): an EMPLOYEE_BALANCE cash out keeps amount, reason, dates and state for every reader (the cash count
        needs them); employee, note and receivable_id are returned only to company-scope payroll.view or receivable.issue holders (both private, Admin seed) and to the employee themself
        — others get null + employee_hidden: true (UI "Staff advance").'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CashOut'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
      - cash-outs
      operationId: cashOutUpdate
      summary: Correct a cash out while the day is open (P7.CSO.05) — owner E5
      x-permission: cashout.update (branch data); an EMPLOYEE_BALANCE cash out also receivable.issue (Part 5 — private)
      description: 'P7-RULE-10 — DayLock on the stored and the new date (422 day_closed); 422 reason_type_change (same accounting type only) · use_cancel (EMPLOYEE_BALANCE amount / employee)
        · amount_below_returned · date_in_future · reason_inactive; 409 invalid_transition (cancelled) · cash_out_converted · conflict (date changed between read and lock); 400 reason_required
        (edit_reason — stored in the interceptor audit row cash_out.update); 403 forbidden (EMPLOYEE_BALANCE without receivable.issue). EXPENSE: the linked source-2 expense is soft-deleted
        and a new APPROVED one inserted in the same transaction (an APPROVED expense is never edited in place). EMPLOYEE_BALANCE: a note edit updates the receivable reason (Part 5 Receivables.updateForCashOut).'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/XRequestedWith'
