      - branch_id
      - location_type
      - booked_employee_id
      - starts_at
      - items
      - phone
      - customer_name
    BookingItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        sort_order:
          type: integer
        service:
          type: object
          properties:
            id:
              type: string
              format: uuid
