                - 1
                - 2
                - 3
                description: 1 CUSTOMER · 2 STAFF · 3 SYSTEM (no-show timer)
              reason_name_mm:
                type: string
              reason_name_en:
                type:
                - string
                - 'null'
            required:
            - at
            - actor
            - reason_name_mm
          - type: 'null'
        cancel_reasons:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              name_mm:
                type: string
              name_en:
                type:
                - string
                - 'null'
              requires_note:
                type: boolean
            required:
            - id
            - name_mm
            - requires_note
        updated_at:
          type: string
          format: date-time
          description: Send back as expected_updated_at on reschedule
      required:
      - status
      - branch
      - location_type
      - employee
      - starts_at
      - ends_at
      - business_date
      - items
      - subtotal_amount
      - total_amount
      - duration_minutes
      - phone_masked
      - can_change
      - updated_at
      description: No customer name or phone (API-PUB-02); cancel_reasons only while can_change (non-system, active)
    PublicBookingCreated:
      allOf:
      - $ref: '#/components/schemas/PublicBooking'
      - type: object
        properties:
          manage_url:
            type: string
            format: uri
        required:
        - manage_url
    PublicRescheduleRequest:
      type: object
      properties:
        starts_at:
          type: string
          format: date-time
        employee_id:
          type: string
          format: uuid
        location_type:
          type: integer
          enum:
          - 1
          - 2
          description: 1 BRANCH (shop) · 2 HOME (D-BKG-22)
        home_address:
          type:
          - string
          - 'null'
        home_address_note:
          type:
          - string
          - 'null'
        items:
          type: array
          items:
            $ref: '#/components/schemas/RescheduleItem'
          minItems: 1
          description: ≤ booking.public_max_services (5) — else 422 too_many_services
        expected_updated_at:
          type: string
          format: date-time
          description: PublicBooking.updated_at — a change in between → 409 conflict
        expected_total_amount:
          type: integer
          minimum: 0
          description: Required by publicReschedule (400 validation if missing); ignored by the preview
      required:
      - starts_at
    PublicReschedulePreview:
      type: object
      properties:
        available:
          type: boolean
        unavailable_reason:
          type:
          - string
          - 'null'
        current:
          type: object
          properties:
            starts_at:
              type: string
              format: date-time
            ends_at:
              type: string
              format: date-time
            employee_id:
              type: string
              format: uuid
            location_type:
              type: integer
              enum:
              - 1
              - 2
              description: 1 BRANCH (shop) · 2 HOME (D-BKG-22)
            total_amount:
              type: integer
              minimum: 0
              description: Whole MMK (D-PLT-04)
        proposed:
          type: object
          properties:
            starts_at:
              type: string
              format: date-time
            ends_at:
              type: string
              format: date-time
            employee_id:
              type: string
              format: uuid
            location_type:
              type: integer
              enum:
              - 1
              - 2
              description: 1 BRANCH (shop) · 2 HOME (D-BKG-22)
            transport_fee_amount:
              type:
              - integer
              - 'null'
              minimum: 0
            removed_item_ids:
              type: array
              items:
                type: string
                format: uuid
            items:
              type: array
              items:
                type: object
                properties:
