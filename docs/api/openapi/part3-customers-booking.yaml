                type:
                - integer
                - 'null'
          - type: 'null'
      required:
      - type
      - id
      - at
      - branch_id
      - status
    CancelReason:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name_mm:
          type: string
        name_en:
          type:
          - string
          - 'null'
        requires_note:
          type: boolean
        system_code:
          type:
          - integer
          - 'null'
          enum:
          - 1
          - null
          description: 1 NO_SHOW (locked row) · null = admin-made
        sort_order:
          type: integer
        status:
          type: integer
          enum:
          - 0
          - 1
