          format: uuid
          description: Required for OPTIONS services (variant_required)
      required:
      - service_id
    BookingCreate:
      type: object
      properties:
        manage_token:
          type: string
          pattern: ^[A-Za-z0-9_-]{43}$
          description: 32 random bytes, base64url without padding — generated by the client (ADR-004); never logged
        branch_id:
          type: string
          format: uuid
        location_type:
          type: integer
          enum:
          - 1
          - 2
          description: 1 BRANCH (shop) · 2 HOME (D-BKG-22)
        home_address:
          type:
          - string
          - 'null'
          description: Required when location_type = 2
        home_address_note:
          type:
          - string
          - 'null'
        booked_employee_id:
          type: string
          format: uuid
        starts_at:
          type: string
          format: date-time
        items:
          type: array
          items:
            $ref: '#/components/schemas/ItemRef'
          minItems: 1
        phone:
          type: string
          maxLength: 50
          description: Any format — normalised to E.164 (API-DATA-06)
        customer_name:
          type: string
          minLength: 1
          maxLength: 255
          description: Name for this booking (F-BK-19)
        expected_total_amount:
          type:
          - integer
