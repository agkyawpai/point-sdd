          pattern: ^[A-Za-z0-9_-]{43}$
          description: 32 random bytes, base64url without padding — generated by the client (ADR-004); never logged
        description: Manage token (FE-MNG-01). Redacted in logs (/public/bookings/***). Malformed or unknown → 404 not_found (identical body)
      - name: keep
        in: query
        schema:
          type: array
          items:
            type: string
            format: uuid
        description: Repeatable booking_item_id of a kept item (snapshot duration — P3-RULE-06). Neither keep nor item sent = all current items kept; otherwise exactly the listed items
        style: form
        explode: true
      - name: item
        in: query
        schema:
          type: array
          items:
            type: string
            pattern: ^[0-9a-f-]{36}(:[0-9a-f-]{36})?$
        description: 'Repeatable: service_id or service_id:service_variant_id (OPTIONS services need the variant)'
        style: form
        explode: true
      - name: employee_id
        in: query
        schema:
          type: string
          format: uuid
        description: Default = the booked barber; a different barber reprices and re-times every item (P3-RULE-06)
      - name: location_type
        in: query
        schema:
          type: integer
          enum:
          - 1
          - 2
        description: Default = the booking location (P3-RULE-06)
      - name: date
        in: query
        schema:
          type: string
          format: date
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicAvailabilitySlots'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
      security: []
