components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: point_session
      description: Server-side session — D-AUTH-06. Mutating requests also need X-Requested-With (API-AUTH-02).
  parameters:
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
      description: Opaque cursor from next_cursor
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    XRequestedWith:
      name: X-Requested-With
      in: header
      required: true
      schema:
        type: string
        enum:
        - point-app
      description: CSRF guard for cookie-authenticated mutations (API-AUTH-02)
  responses:
    ValidationError:
      description: 400 validation · phone_invalid · reason_required (errors[] per field)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthenticated:
      description: 401 unauthenticated · session_revoked
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: 403 forbidden · out_of_scope · company_scope_required (ADR-012) · csrf · captcha_failed (public create, also a filled honeypot)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: 404 not_found (unknown id, out-of-scope single read, unknown or malformed manage token — identical body)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: 409 slot_taken (errors[].params.next_free) · price_changed · already_exists · invalid_transition · customer_has_active_bookings · system_row · conflict
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unprocessable:
      description: 422 business rule — codes in docs/api/03-customers-booking.md §9 (active_booking_exists, too_many_services, change_cutoff_passed, outside_window, date_closed, not_eligible,
        …)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    RateLimited:
      description: 429 rate_limited (retry_after seconds)
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ServiceUnavailable:
      description: 503 captcha_unavailable (Turnstile unreachable) · maintenance (FE-BK-16)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Problem:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        code:
          type: string
          description: Language key under error.* (API-ERR-01)
        detail:
          type: string
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              code:
                type: string
              params:
                type: object
                additionalProperties: true
        request_id:
          type: string
          format: uuid
          description: Server-generated UUIDv7 (API-ERR-01)
        context:
          type: object
          additionalProperties: true
          description: 'Machine data for some codes (API-ERR-01 v1.4): price_changed → quote / preview; already_exists → customer_id, status, archived; customer_has_active_bookings →
            count'
      required:
      - type
      - title
      - status
      - code
    CustomerCreate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        phone:
          type: string
          maxLength: 50
          description: Any format — normalised to E.164 (API-DATA-06)
        notes:
          type:
          - string
          - 'null'
          maxLength: 2000
      required:
      - name
      - phone
    CustomerUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        phone:
          type: string
          maxLength: 50
          description: Any format — normalised to E.164 (API-DATA-06)
        notes:
          type:
          - string
          - 'null'
          maxLength: 2000
        expected_updated_at:
          type: string
          format: date-time
      required:
      - expected_updated_at
    CustomerListItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        phone:
          type: string
        phone_normalized:
          type: string
          pattern: ^\+[1-9][0-9]{6,14}$
        status:
          type: integer
          enum:
          - 0
          - 1
          description: 0 INACTIVE · 1 ACTIVE
        archived_at:
          type:
          - string
          - 'null'
          format: date-time
        last_visit_at:
          type:
          - string
          - 'null'
          format: date-time
        visit_count:
          type: integer
      required:
      - id
      - name
      - phone
      - phone_normalized
      - status
      - visit_count
    CustomerStats:
      type: object
      properties:
        visit_count:
          type: integer
        total_spent_amount:
          type: integer
          minimum: 0
          description: Whole MMK (D-PLT-04)
        last_visit_at:
          type:
          - string
          - 'null'
          format: date-time
        no_show_count:
          type: integer
        cancelled_count:
          type: integer
        preferred_employee:
          oneOf:
          - type: object
            properties:
              id:
                type: string
                format: uuid
              display_name:
                type: string
            required:
            - id
            - display_name
          - type: 'null'
          description: '≥ preferred_barber_min_visits (3) of the last preferred_barber_window (5) FINISHED visits — owner #6'
        scope_note:
          type: string
          enum:
          - read_scope
          - company
          description: read_scope = counted at the caller branches only (P3-RULE-03)
      required:
      - visit_count
      - total_spent_amount
      - no_show_count
      - cancelled_count
      - preferred_employee
      - scope_note
    UpcomingBooking:
      type: object
      properties:
        id:
          type: string
          format: uuid
        starts_at:
          type: string
          format: date-time
        branch_id:
          type: string
          format: uuid
        booked_employee_id:
          type: string
          format: uuid
      required:
      - id
      - starts_at
      - branch_id
    Customer:
      allOf:
      - $ref: '#/components/schemas/CustomerListItem'
      - type: object
        properties:
          notes:
            type:
            - string
            - 'null'
          stats:
            $ref: '#/components/schemas/CustomerStats'
          upcoming_bookings:
            type: array
            items:
              $ref: '#/components/schemas/UpcomingBooking'
          created_at:
            type: string
            format: date-time
          updated_at:
            type: string
            format: date-time
        required:
        - stats
        - upcoming_bookings
        - created_at
        - updated_at
    CustomerLookup:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        phone:
          type: string
        status:
          type: integer
          enum:
          - 0
          - 1
          description: 0 INACTIVE · 1 ACTIVE
        notes:
          type:
          - string
          - 'null'
        last_visit_at:
          type:
          - string
          - 'null'
          format: date-time
        upcoming_bookings:
          type: array
          items:
            $ref: '#/components/schemas/UpcomingBooking'
      required:
      - id
      - name
      - phone
      - status
      - upcoming_bookings
    TimelineEntry:
      type: object
      properties:
        type:
          type: string
          enum:
          - booking
          - visit
          - sale
          description: 'sale = a visit-less sale — product-only (D-PAY-03) or a difference sale (Part 4 P4-RULE-12, owner B10 — v1.1)'
        id:
          type: string
          format: uuid
        at:
          type: string
          format: date-time
        branch_id:
          type: string
          format: uuid
        status:
          type: integer
          description: 'Booking status (0–3) or visit status (Part 4: 0 INCOMPLETE · 1 STARTED · 2 COMPLETED · 3 FINISHED)'
        employee:
          type: object
          properties:
            id:
              type: string
              format: uuid
            display_name:
              type: string
          required:
          - id
          - display_name
        services_label_mm:
          type:
          - string
          - 'null'
        services_label_en:
          type:
          - string
          - 'null'
        total_amount:
          type:
          - integer
          - 'null'
          minimum: 0
        receipt_number:
          type:
          - string
          - 'null'
        cancel_reason:
          oneOf:
          - type: object
            properties:
              name_mm:
                type: string
              name_en:
                type:
                - string
                - 'null'
