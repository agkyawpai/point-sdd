openapi: 3.1.0
info:
  title: Point Barbershop API — Part 3 · Customers & Booking (+ public booking)
  version: 1.1.0
  summary: Customers (shared), cancel reasons, staff bookings, calendar feed, no-show, public booking modal and manage link
  description: 'Design document for Part 3 (docs/api/03-customers-booking.md). Conventions: docs/api/00-conventions.md (v1.5).

    Decisions served: D-CUS-01..09, D-BKG-01..23, D-SVC-04..08, D-SCH-03, D-ROLE-02/03/07/09 (ADR-011, ADR-012), D-NTF-01..03, D-AUD-01, D-DAT-05, D-DB-03/07, ADR-002/004/006/009.

    Status: 🔒 LOCKED v1.1 = D-API-04 (owner one-sheet "အကုန်လုံး OK", 02/Oct/2026 00:06 — A1 lock; A2 a service removed by a reschedule deletes its booking_items row with the full before-image in the audit; A3 Manager seed kept). v1.1 also: booked ≠ actual barber at START -> the lower price and FINISH / INCOMPLETE emit booking.updated status 3 (Part 4); timeline sale entries cover difference sales; public barber photo_url = stable media path (Part 8); booking QR = Part 8 P8.WEB.11 + export kind booking_qr_poster. Review fixes 02/Oct (no version bump): public booking endpoints accept any ACTIVE branch (is_public only hides it from the website listing); the no-show jobs skip bookings whose date is inside an active branch closure (owner F8). v1.0 was written after the owner answered the Part 3 sheet "အကုန် OK". DB Part 3 v3 unchanged.

    x-permission on every operation: "<module>.view+" = view or any other code of the module (API-PERM-06); "any staff (read scope)" = operational read, no code; "self" = the caller
    is the booked barber (own bookings need no code — owner #9); levels per ADR-012: customers = shared, bookings = branch data, cancel reasons = company master.

    Every staff operation may also return 401 and 503 (maintenance); mutating staff operations need X-Requested-With: point-app (API-AUTH-02). Public operations (security: []) have no
    session and are rate-limited (API-LIM-01); token paths are redacted in logs.

    Conventions reminders: money = integer MMK; timestamps ISO 8601 with +06:30; business dates MMT; status/type = smallint codes (D-DB-03); errors = RFC 9457 problem+json with code
    = language key.'
servers:
- url: /api/v1
  description: Same origin as the app / site — Caddy routes /api/* to NestJS (ADR-009); on <domain> only /api/v1/public/* is forwarded
- url: http://localhost:3000/api/v1
  description: Local development through the dev Caddy
tags:
- name: customers
  description: Shared company customers — D-CUS-01..09 (ADR-012 shared level)
- name: cancel-reasons
  description: Booking cancel reasons master list — D-BKG-14/17 (company master)
- name: bookings
  description: Staff bookings, calendar feed, reschedule, cancel, no-show — D-BKG-01..23
- name: public-booking
  description: Website booking modal — FE-BK-*, D-BKG-21
- name: public-manage
  description: Manage-link page — FE-CONF-*, FE-MNG-*, D-BKG-11/12/16
security:
- sessionCookie: []
paths:
  /customers:
    get:
      tags:
      - customers
      operationId: customerList
      summary: List / search customers (P3.CUS.01) — D-CUS-06/07, AD-CUS-01
      x-permission: customer.view+ (shared — any scope; statistics in the caller read scope)
      parameters:
      - name: q
        in: query
        schema:
          type: string
        description: Name or phone in any format (≥ 6 digits = phone search)
      - name: status
        in: query
        schema:
          type: array
          items:
            type: integer
            enum:
            - 0
            - 1
        description: 'Repeatable; default 1 (owner #7 — Inactive hidden until filtered)'
        style: form
        explode: true
      - name: include_archived
        in: query
        schema:
          type: boolean
          default: false
      - name: sort
        in: query
        schema:
          type: string
          enum:
          - name
          - -last_visit_at
          - -created_at
          default: -last_visit_at
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/CustomerListItem'
                  next_cursor:
                    type:
                    - string
                    - 'null'
                  total:
                    type:
                    - integer
                    - 'null'
                required:
                - items
                - next_cursor
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
      - customers
      operationId: customerCreate
      summary: Add a customer (P3.CUS.03)
      x-permission: customer.create (shared)
      description: Existing phone → 409 already_exists { customer_id, status, archived }. Automatic creation by a booking / walk-in needs no code (P3-RULE-01).
      parameters:
      - $ref: '#/components/parameters/XRequestedWith'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /customers/lookup:
    get:
      tags:
      - customers
      operationId: customerLookup
      summary: Exact phone lookup for the booking drawer and FINISH (P3.CUS.02) — AD-FORM-10
      x-permission: any staff (read scope) — operational
      parameters:
      - name: phone
        in: query
        schema:
          type: string
          maxLength: 50
          description: Any format — normalised to E.164 (API-DATA-06)
        description: Any format; normalised to E.164
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  customer:
                    oneOf:
                    - $ref: '#/components/schemas/CustomerLookup'
                    - type: 'null'
                  archived:
                    type: boolean
                    description: true when the phone belongs to an archived customer (a booking restores it — P3-RULE-01)
                required:
                - customer
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /customers/{id}:
    get:
      tags:
      - customers
      operationId: customerGet
      summary: Customer detail + statistics (P3.CUS.04) — AD-CUS-02, D-CUS-07/08/09
      x-permission: customer.view+ (shared; stats / upcoming in the caller read scope)
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
      - customers
      operationId: customerUpdate
      summary: Edit name / phone / notes (P3.CUS.05)
      x-permission: customer.update (shared)
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/XRequestedWith'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerUpdate'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /customers/{id}/status:
    post:
      tags:
      - customers
      operationId: customerSetStatus
      summary: Inactive / Active (P3.CUS.06)
      x-permission: customer.delete (shared)
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/XRequestedWith'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: integer
                  enum:
                  - 0
                  - 1
              required:
              - status
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /customers/{id}/archive:
    post:
      tags:
      - customers
      operationId: customerArchive
      summary: Archive (soft delete) (P3.CUS.07)
      x-permission: customer.delete (shared)
      description: 409 customer_has_active_bookings { count } while BOOKED / STARTED bookings exist (P3-RULE-02).
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/XRequestedWith'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                note:
                  type:
                  - string
                  - 'null'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /customers/{id}/restore:
    post:
      tags:
      - customers
      operationId: customerRestore
      summary: Restore an archived customer (P3.CUS.08)
      x-permission: customer.delete (shared)
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/XRequestedWith'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /customers/{id}/timeline:
    get:
      tags:
      - customers
      operationId: customerTimeline
      summary: Bookings and visits, newest first (P3.CUS.09) — read scope only
      x-permission: customer.view+ (shared)
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/TimelineEntry'
                  next_cursor:
                    type:
                    - string
                    - 'null'
                  total:
                    type:
                    - integer
                    - 'null'
                required:
                - items
                - next_cursor
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /booking-cancel-reasons:
    get:
      tags:
      - cancel-reasons
      operationId: cancelReasonList
      summary: Cancel reasons for the cancel dialog (P3.CRS.01) — D-BKG-14
      x-permission: any staff (read scope) — operational; include_archived=true -> booking_cancel_reason.view+
      parameters:
      - name: status
        in: query
        schema:
          type: array
          items:
            type: integer
            enum:
            - 0
            - 1
        description: Repeatable; default 1
        style: form
        explode: true
      - name: include_archived
        in: query
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/CancelReason'
                required:
                - items
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
      - cancel-reasons
      operationId: cancelReasonCreate
      summary: Add a cancel reason (P3.CRS.02)
      x-permission: 'booking_cancel_reason.create (company master: company scope)'
      parameters:
      - $ref: '#/components/parameters/XRequestedWith'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name_mm:
                  type: string
                  minLength: 1
                  maxLength: 150
                name_en:
                  type:
                  - string
                  - 'null'
                  maxLength: 150
                requires_note:
                  type: boolean
                  default: false
                sort_order:
                  type: integer
              required:
              - name_mm
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelReason'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /booking-cancel-reasons/order:
    put:
      tags:
      - cancel-reasons
      operationId: cancelReasonReorder
      summary: Reorder (P3.CRS.05)
      x-permission: 'booking_cancel_reason.update (company master: company scope)'
      parameters:
      - $ref: '#/components/parameters/XRequestedWith'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ids:
                  type: array
                  items:
                    type: string
                    format: uuid
                  minItems: 1
              required:
              - ids
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/CancelReason'
                required:
                - items
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /booking-cancel-reasons/{id}:
    patch:
      tags:
      - cancel-reasons
      operationId: cancelReasonUpdate
      summary: Edit a cancel reason (P3.CRS.03)
      x-permission: 'booking_cancel_reason.update (company master: company scope)'
      description: 'System row (system_code 1): only the names may change — 409 system_row.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/XRequestedWith'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name_mm:
                  type: string
                  minLength: 1
                  maxLength: 150
                name_en:
                  type:
                  - string
                  - 'null'
                  maxLength: 150
                requires_note:
                  type: boolean
                status:
                  type: integer
                  enum:
                  - 0
                  - 1
                expected_updated_at:
                  type: string
                  format: date-time
              required:
              - expected_updated_at
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelReason'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /booking-cancel-reasons/{id}/archive:
    post:
      tags:
      - cancel-reasons
      operationId: cancelReasonArchive
      summary: Archive a cancel reason (P3.CRS.04)
      x-permission: 'booking_cancel_reason.delete (company master: company scope)'
      description: System row → 409 system_row.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/XRequestedWith'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelReason'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /bookings:
    get:
      tags:
      - bookings
      operationId: bookingList
      summary: Bookings list (P3.BKG.01) — AD-BKG-08
      x-permission: booking.view+ (branch scope-filtered)
      parameters:
      - name: branch_id
        in: query
        schema:
          type: string
          format: uuid
      - name: employee_id
        in: query
        schema:
          type: string
          format: uuid
      - name: customer_id
        in: query
        schema:
          type: string
          format: uuid
      - name: status
        in: query
        schema:
          type: array
          items:
            type: integer
            enum:
            - 0
            - 1
            - 2
            - 3
            description: 0 CANCELLED · 1 BOOKED · 2 STARTED · 3 COMPLETED (D-BKG-18, D-DB-03)
        description: Repeatable
        style: form
        explode: true
      - name: channel
        in: query
        schema:
          type: array
          items:
            type: integer
            enum:
            - 1
            - 2
            description: 1 ONLINE · 2 STAFF
        description: Repeatable
        style: form
        explode: true
      - name: location_type
        in: query
        schema:
          type: array
          items:
            type: integer
            enum:
            - 1
            - 2
            description: 1 BRANCH (shop) · 2 HOME (D-BKG-22)
        description: Repeatable
        style: form
        explode: true
      - name: from
        in: query
        schema:
          type: string
          format: date
        description: Business date; default today
      - name: to
        in: query
        schema:
          type: string
          format: date
        description: Business date; default today + window
      - name: q
        in: query
        schema:
          type: string
        description: Customer name or phone
      - name: sort
        in: query
        schema:
          type: string
          enum:
          - starts_at
          - -starts_at
          default: starts_at
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/BookingListItem'
                  next_cursor:
                    type:
                    - string
                    - 'null'
                  total:
                    type:
                    - integer
                    - 'null'
                required:
                - items
                - next_cursor
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
      - bookings
      operationId: bookingCreate
      summary: Create a staff booking (P3.BKG.04) — P3-RULE-04, AD-BKG-01/02
      x-permission: 'booking.create (branch of branch_id) | self (booked_employee_id = caller, assigned to the branch on the date — owner #9)'
      description: 'Errors: 400 validation (address fields with location_type 1) · 409 slot_taken (errors[].params.next_free) · 409 price_changed (context.quote) · 422 outside_window
        / date_closed / not_eligible / not_assigned_to_branch / item codes / home_address_required / idempotency_mismatch.'
      parameters:
      - $ref: '#/components/parameters/XRequestedWith'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingCreated'
        '200':
          description: Idempotent replay (same manage_token and identifying fields)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingCreated'
          headers:
            Idempotent-Replayed:
              schema:
                type: boolean
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /calendar/bookings:
    get:
      tags:
      - bookings
      operationId: calendarBookings
      summary: Calendar feed (P3.BKG.02) — AD-CAL-01..07; no phone / address
      x-permission: any staff (read scope) — operational
      parameters:
      - name: branch_id
        in: query
        schema:
          type: string
          format: uuid
        description: branch_id or employee_id required
      - name: employee_id
        in: query
        schema:
          type: string
          format: uuid
        description: Without branch_id = barber view across branches (out-of-scope bookings redacted)
      - name: from
        in: query
        schema:
          type: string
          format: date
        required: true
      - name: to
        in: query
        schema:
          type: string
          format: date
        description: ≤ 42 days after from
        required: true
      - name: include_cancelled
        in: query
        schema:
          type: boolean
          default: false
        description: Adds cancelled bookings (AD-TODAY-04)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/CalendarBooking'
                required:
                - items
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /me/bookings:
    get:
      tags:
      - bookings
      operationId: myBookings
      summary: My bookings (P3.BKG.03) — AD-TODAY-01
      x-permission: self
      parameters:
      - name: from
        in: query
        schema:
          type: string
          format: date
      - name: to
        in: query
        schema:
          type: string
          format: date
      - name: status
        in: query
        schema:
          type: array
          items:
            type: integer
            enum:
            - 0
            - 1
            - 2
            - 3
            description: 0 CANCELLED · 1 BOOKED · 2 STARTED · 3 COMPLETED (D-BKG-18, D-DB-03)
        description: Repeatable; default 1, 2
        style: form
        explode: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Booking'
                required:
                - items
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /bookings/{id}:
    get:
      tags:
      - bookings
      operationId: bookingGet
      summary: Booking detail (P3.BKG.05) — AD-BKG-03
      x-permission: booking.view+ (branch) | self (booked barber)
      parameters:
      - name: id
