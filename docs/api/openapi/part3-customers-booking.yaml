      summary: Reschedule through the link (P3.PUB.11) — cutoff, ≤ 5 services
      x-permission: public (no session; rate limit API-LIM-01)
      description: '422 change_cutoff_passed (owner #1 — 120 min) / too_many_services · 409 slot_taken / price_changed / invalid_transition / conflict (expected_updated_at).'
      parameters:
