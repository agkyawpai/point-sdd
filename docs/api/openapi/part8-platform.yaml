components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: point_session
      description: Server-side session — D-AUTH-06. Mutating requests also need X-Requested-With (API-AUTH-02).
    internalKey:
      type: apiKey
      in: header
      name: X-Internal-Key
      description: INTERNAL_OPS_KEY from .env (API, backup sidecar, restore script only — the web container holds a different secret, INTERNAL_SSR_KEY, which only lifts the per-IP limit
        on /public/* and is refused here); /api/v1/internal/* is reachable only over the Docker network (Caddy 404s it and strips the inbound header — ADR-009)
  parameters:
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
      description: Opaque cursor from next_cursor
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    XRequestedWith:
      name: X-Requested-With
      in: header
      required: true
      schema:
        type: string
        enum:
        - point-app
      description: CSRF guard for cookie-authenticated mutations (API-AUTH-02)
    InternalKey:
      name: X-Internal-Key
      in: header
      required: true
      schema:
        type: string
      description: INTERNAL_OPS_KEY (ADR-009 — never the SSR key)
  responses:
    ValidationError:
      description: 400 validation (errors[].field) · reason_required
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthenticated:
      description: 401 unauthenticated · session_revoked · internal key missing
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: 403 forbidden (context.required) · out_of_scope · company_scope_required (company master / private codes at branch scope) · csrf
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: 404 not_found (also hidden audit rows, other users' notifications / exports, non-public media or branches)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: 409 invalid_transition · conflict (expected_updated_at) · notification_mandatory · attachment_in_use · closure_overlap · restore_pending
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unprocessable:
      description: 422 business rule — codes in docs/api/08-platform.md §16 (file_too_large, file_type_not_allowed, attachment_invalid, range_too_long, date_in_future, date_in_past,
        closure_started, closure_past, report_timeout, export_too_large, import_file_unreadable, import_mapping_incomplete, import_no_valid_rows, backup_not_restorable, confirm_mismatch)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    RateLimited:
      description: 429 rate_limited { retry_after } (API-LIM-01 — JSON 60 / min / IP, media 600 / min / IP; SSR calls with INTERNAL_SSR_KEY and staff sessions are exempt)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ServiceUnavailable:
      description: 503 maintenance { until, message_mm, message_en } (D-PLT-08; company-scope settings.update holders pass, and /backups/* also for company-scope backup.restore holders
        — API-AUTH-06)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Problem:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        code:
          type: string
          description: Language key under error.* (API-ERR-01)
        detail:
          type: string
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              code:
                type: string
              params:
                type: object
                additionalProperties: true
        request_id:
          type: string
          format: uuid
          description: Server-generated UUIDv7 (API-ERR-01)
        context:
          type: object
          additionalProperties: true
          description: 'Machine data (API-ERR-01 v1.4): file_too_large → { max_mb } · file_type_not_allowed → { allowed[] } · attachment_invalid → { attachment_id, reason } · attachment_in_use
            → { field } · closure_overlap → { closure_id } · restore_pending → { run_id } · backup_not_restorable → { reason } · export_too_large → { row_count, max_rows } · import_mapping_incomplete
            → { missing[] } · range_too_long → { max_days } · invalid_transition → { status } · forbidden → { required } · rate_limited → { retry_after } · maintenance → { until, message_mm,
