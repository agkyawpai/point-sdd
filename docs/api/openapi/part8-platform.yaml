openapi: 3.1.0
info:
  title: Point Barbershop API — Part 8 · Platform
  version: 1.0.0
  summary: Notifications, attachments, employee documents, audit log, import, export, backups, website management, public site, reports, dashboards
  description: 'Design document for Part 8 (docs/api/08-platform.md). Conventions: docs/api/00-conventions.md (v1.5 — incl. the idempotency wording of contract 15).

    v1.0 (02/Oct, batch consistency pass — no version bump): notification catalogue re-checked against Parts 1–7; attention cards + negative stock / counts in progress; this part''s
    research items written "research E…" (owner E3 / E6 = the sheet''s Part 7 answers). Fix-up 02/Oct (batch v5.2.15): EMPLOYEE_BALANCE cash-out audit rows = pay rows and report ⑤ masks
    the staff-advance taker (owner C1 + D-FIN-06); public site responses Cache-Control public, max-age=10 (ADR-006 ~10 s target); backup.failed / job.failed basis D-DAT-03 + contract
    14. Review fixes 02/Oct (independent review, 29 findings — docs §20; no version bump): closure archive = future only; import DTO fields mapped to the real columns; import_too_many_rows
    = a FAILED job message, not an HTTP error; public media own limit 600 / min / IP and Cache-Control public, max-age=86400 + ETag; two internal secrets (INTERNAL_SSR_KEY for SSR calls,
    INTERNAL_OPS_KEY for /internal/*) and P8.INT.01 kinds 1–3; Attachment.mime_type; dashboard tile schema; /backups/* usable during maintenance by backup.restore holders.

    Reconcile 02/Oct (cross-part reconcile — no version bump): closure archive allowed while start_date ≥ today; an audit.view holder always sees the rows they authored, employee-targeted
    rows carry the primary branch of the employee; EMPLOYEE_BALANCE cash-out audit rows and the report ⑤ taker = company-scope payroll.view or receivable.issue.

    Decisions served: D-NTF-01..03, D-AUD-01/02, D-DAT-01..05, D-WEB-01..04, D-UX-05, D-RPT-01, D-KPI-01..03, D-DSH-01..04, D-EMP-03, D-FIN-03, D-PLT-03/04/05/07/08/15/16, D-ROLE-02/03/07/08/09
    (ADR-011, ADR-012 + contract 1 private level), D-DB-12, ADR-002 / 006 / 007 / 009 / 013 / 014 / 015.

    Status: 🔒 LOCKED v1.0 — D-API-09 (owner one-sheet "အကုန်လုံး OK", 02/Oct/2026 00:06 — F1–F12, G (e), H). DB Part 8 v1.1 (backup_runs_restore_chk: RESTORE_TEST may have performed_by_user_id
    null; attachments_deleted_chk: deleted_at with deleted_by_user_id null = system clean-up).

    x-permission on every operation: "<module>.view+" = view or any other code of the module (API-PERM-06); "any staff (read scope)" = operational, no code; "self" = own rows; "public"
    = no session (security: []); "internal" = X-Internal-Key carrying INTERNAL_OPS_KEY, Docker network only (ADR-009). Levels per ADR-012 + contract 1: site content, notification types,
    backups, imports = company master (backup and import reads need company scope too); hours, closures, reports ①–⑤ ⑧–⑩ = branch data; website.* = mixed (owner F7); audit.view = branch
    (branch-less rows company scope, pay / document rows private — owner F10); report ⑦ and employee.documents = private; data.export = mixed on top of the source''s read right (owner
    F2).

    Every staff operation may also return 401 and 503 (maintenance); mutating staff operations need X-Requested-With: point-app (API-AUTH-02). No operation of this part needs an Idempotency-Key
    (no money rows); actions are idempotent by state.

    Conventions reminders: money = integer MMK; timestamps ISO 8601 with +06:30; business dates MMT; status / type = smallint codes (D-DB-03); errors = RFC 9457 problem+json with code
    = language key; binary responses (exports, templates, error rows, media) are the only non-JSON bodies besides the multipart upload.'
servers:
- url: /api/v1
  description: Same origin as the app — Caddy routes /api/* to NestJS (ADR-009)
- url: http://localhost:3000/api/v1
  description: Local development through the dev Caddy
tags:
- name: notifications
  description: Bell — own notifications (D-NTF-01/02) — self
- name: notification-types
  description: Notification types enable / disable (D-NTF-03) — company master
- name: attachments
  description: Staging uploads, metadata, signed URLs, removal (ADR-014) — policy = the owning entity
- name: employee-documents
  description: Staff documents (D-EMP-03, owner F11) — private
- name: audit
  description: Audit-log viewer (D-AUD-01/02, owner F10) — branch rows / company / private
- name: imports
  description: Import upload → map → validate → preview → confirm (D-DAT-01, owner F5) — company master
- name: exports
  description: Excel / CSV / PDF exports and posters (D-DAT-02, owner F2 / F3)
- name: backups
  description: Backup runs and restore authorisation (D-DAT-03/04, owner F9) — company master
- name: internal
  description: Backup sidecar / restore script reports (ADR-002, ADR-009) — internal key
- name: website
  description: Website management (D-WEB-01..04, owner F7 / F8) — mixed
- name: public-site
  description: Public site data and media (API-PUB-01..03) — no session
- name: reports
  description: The 10 reports (D-RPT-01, owner F1 / F6) — one code per report
- name: dashboards
  description: Dashboards and approval counts (D-DSH-01..04)
security:
- sessionCookie: []
paths:
  /notifications:
    get:
      tags:
      - notifications
      operationId: notificationList
      summary: Bell — my notifications (P8.NTF.01) — 🔒 D-NTF-01, AD-NTF-01
      x-permission: self
      description: Newest first; deleted rows excluded; rows older than 90 days are purged (D-NTF-02). The client renders template_key + payload in the viewer's language (D-PLT-03).
      parameters:
      - name: unread
        in: query
        schema:
          type: boolean
        description: true = unread only
      - name: category
        in: query
        schema:
          type: array
          items:
            type: integer
            enum:
            - 1
            - 2
            - 3
            - 4
            - 5
            - 6
            description: 1 BOOKING · 2 STAFF · 3 MONEY · 4 STOCK · 5 PAYROLL · 6 SECURITY (D-NTF-03)
        description: Repeatable
        style: form
        explode: true
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Notification'
                  next_cursor:
                    type:
                    - string
                    - 'null'
                  total:
                    type:
                    - integer
                    - 'null'
                  unread_count:
                    type: integer
                required:
                - items
                - next_cursor
                - unread_count
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /notifications/unread-count:
    get:
      tags:
      - notifications
      operationId: notificationUnreadCount
      summary: Unread count (P8.NTF.02)
      x-permission: self
      description: Exact count; the UI caps the badge at 99+.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                required:
                - count
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /notifications/{id}/read:
    post:
      tags:
      - notifications
      operationId: notificationRead
      summary: Mark one read (P8.NTF.03)
      x-permission: self
      description: 'Idempotent — already read → 200 unchanged. Realtime notification.updated { change: "read" }. Another user''s id → 404.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/XRequestedWith'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
  /notifications/read-all:
    post:
      tags:
      - notifications
      operationId: notificationReadAll
      summary: Mark all read (P8.NTF.04)
      x-permission: self
      description: Every unread row created ≤ up_to (default now). Realtime notification.read_all.
      parameters:
      - $ref: '#/components/parameters/XRequestedWith'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReadAllRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  updated_count:
                    type: integer
                  unread_count:
                    type: integer
                required:
                - updated_count
                - unread_count
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /notifications/{id}:
    delete:
      tags:
      - notifications
      operationId: notificationDelete
      summary: Delete my notification (P8.NTF.05) — 🔒 D-NTF-02
      x-permission: self
      description: 'Realtime notification.updated { change: "deleted" }.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/XRequestedWith'
      responses:
        '204':
          description: Deleted (soft — deleted_at); repeat → 204
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
  /notification-types:
    get:
      tags:
      - notification-types
      operationId: notificationTypeList
      summary: Notification types (P8.NTT.01) — AD-NTF-02
      x-permission: notification.view+ (company master — read-only at branch scope)
      description: Mandatory types carry a lock; categories and recipients are read-only. Archived types (removed from notifications.json) are excluded.
      parameters:
      - name: category
        in: query
        schema:
          type: array
          items:
            type: integer
            enum:
            - 1
            - 2
            - 3
            - 4
            - 5
            - 6
            description: 1 BOOKING · 2 STAFF · 3 MONEY · 4 STOCK · 5 PAYROLL · 6 SECURITY (D-NTF-03)
        description: Repeatable
        style: form
        explode: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/NotificationType'
                required:
                - items
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /notification-types/{code}:
    patch:
      tags:
      - notification-types
      operationId: notificationTypeUpdate
      summary: Enable / disable a type (P8.NTT.02) — 🔒 D-NTF-03
      x-permission: notification.update (company master — company scope)
      description: Mandatory + enabled false → 409 notification_mandatory (DB CHECK notification_types_mandatory_chk); 409 conflict. Company-level only — no per-user mute (research E12).
        Audit notification_type.enable / disable.
      parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
          pattern: ^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)*$
        description: notifications.json code
      - $ref: '#/components/parameters/XRequestedWith'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationTypeUpdate'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationType'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /attachments:
    post:
      tags:
      - attachments
      operationId: attachmentUpload
      summary: Upload a file — staging row (P8.ATT.01) — ADR-014
      x-permission: any staff (self — staging)
      description: 'Staging row (entity_type uploads, entity_id = the uploader, expires_at +24 h); type by magic bytes (image JPEG / PNG / WebP / HEIC→JPEG, document = + PDF, import
        = CSV / XLSX — CSV has no signature: accepted when the content decodes as UTF-8 without NUL bytes or as UTF-16 with a BOM, review fix 02/Oct); EXIF / GPS stripped; WebP variants
        400 / 800 / 1600. 422 file_too_large { max_mb } (setting system.upload_max_mb) · file_type_not_allowed { allowed }; 400 zawgyi_text for a Zawgyi file name (the client converts
        — API-SHAPE-05). Linked later by the owning endpoint (Attachments.link / replace — 422 attachment_invalid).'
      parameters:
      - $ref: '#/components/parameters/XRequestedWith'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AttachmentUpload'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attachment'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/Unprocessable'
    get:
      tags:
      - attachments
      operationId: attachmentList
      summary: Files of one entity (P8.ATT.02)
      x-permission: entity read right (P8-RULE-03 policy table)
      description: 'Non-deleted files; no URLs (P8.ATT.04). Rows are filtered per (entity, kind) policy — entity_type employees: the photo (kind 2) for any staff, documents (kind 1)
        only with company-scope employee.documents (private); rows the caller may not read are left out (review fix 02/Oct).'
      parameters:
      - name: entity_type
        in: query
        schema:
          type: string
        description: expenses · manual_incomes · employees · services · companies · site · sales · refunds · import_jobs
        required: true
      - name: entity_id
        in: query
        schema:
          type: string
          format: uuid
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Attachment'
                required:
                - items
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /attachments/{id}:
    get:
      tags:
      - attachments
      operationId: attachmentGet
      summary: File metadata (P8.ATT.03)
      x-permission: entity read right (P8-RULE-03 policy table) or self (own staging row)
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attachment'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /attachments/{id}/url:
    get:
      tags:
      - attachments
      operationId: attachmentUrl
      summary: Signed download URL (P8.ATT.04)
      x-permission: entity read right (P8-RULE-03 policy table) or self (own staging row)
      description: Presigned GET valid 5 minutes (ADR-014). Staff-document URLs are audited (employee.document_view — owner F11).
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: variant
        in: query
        schema:
          type: string
          enum:
          - original
          - w400
          - w800
          - w1600
          description: Image variant — WebP widths 400 / 800 / 1600 (contract 11)
      - name: download
        in: query
        schema:
          type: boolean
        description: true = Content-Disposition attachment
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignedUrl'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /attachments/{id}/remove:
    post:
      tags:
      - attachments
      operationId: attachmentRemove
      summary: Remove a file (P8.ATT.05)
      x-permission: entity remove right (P8-RULE-03 policy table) or self (own staging row)
      description: Soft delete; reason required except for one's own staging row (400 reason_required); a file referenced by a single-image field → 409 attachment_in_use { field }; receipts
        / exports / import files → 403; already deleted → 200. Audit attachment.remove.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/XRequestedWith'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RemoveRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attachment'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /employees/{id}/documents:
    get:
      tags:
      - employee-documents
      operationId: employeeDocumentList
      summary: Staff documents (P8.DOC.01) — 🔒 D-EMP-03, owner F11
      x-permission: employee.documents (private — company scope)
      description: Kind-1 documents of the employee (any status). Branch-scope grant → 403 company_scope_required.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Attachment'
                required:
                - items
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags:
      - employee-documents
      operationId: employeeDocumentAttach
      summary: Attach staff documents (P8.DOC.02)
      x-permission: employee.documents (private — company scope)
      description: Staging uploads with purpose document; ≤ 20 per employee (422 attachment_invalid too_many). Audit employee.document_add. Remove = P8.ATT.05.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/XRequestedWith'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentAttach'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Attachment'
                required:
                - items
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /audit-events:
    get:
      tags:
      - audit
      operationId: auditList
      summary: Audit log (P8.AUD.01) — 🔒 D-AUD-01/02, AD-AUD-01
      x-permission: 'audit.view (branch — rows of the grant''s branches and the rows the caller authored (actor_user_id = caller — reconcile 02/Oct); other branch-less rows company scope;
        pay rows company-scope payroll.view — EMPLOYEE_BALANCE cash-out rows (owner C1 + D-FIN-06): payroll.view or receivable.issue; document rows company-scope employee.documents —
        owner F10)'
      description: Read-only — no write endpoint exists (append-only, DB role INSERT / SELECT). An audit.view holder always sees the rows they authored themselves in addition to the
        rows of their branches (D-AUD-01); private rows (pay data, staff documents) keep their own rule. branch_id of an employee-targeted action = the acted-on branch, else the primary
        branch of the employee (API-AUD-01). Hidden rows are left out (no count leak). Keyset cursor (occurred_at, id), newest first.
      parameters:
      - name: entity_type
        in: query
        schema:
          type: string
      - name: entity_id
        in: query
        schema:
          type: string
          format: uuid
      - name: actor_user_id
        in: query
        schema:
          type: string
          format: uuid
      - name: branch_id
        in: query
        schema:
          type: array
          items:
            type: string
            format: uuid
        description: Repeatable; default every branch of the grant; a branch outside → 403 out_of_scope
        style: form
        explode: true
      - name: source
        in: query
        schema:
          type: array
          items:
            type: integer
            enum:
            - 1
            - 2
            - 3
            description: 1 APP · 2 DB_TRIGGER · 3 SYSTEM_JOB (D-AUD-02)
        description: Repeatable
        style: form
        explode: true
      - name: action
        in: query
        schema:
          type: string
        description: Prefix match, e.g. sale.
      - name: request_id
        in: query
        schema:
          type: string
          format: uuid
      - name: from
        in: query
        schema:
          type: string
          format: date
        description: MMT date on occurred_at; default today − 6
      - name: to
        in: query
        schema:
          type: string
          format: date
        description: Default today; ≤ 366 days (422 range_too_long)
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuditEventListItem'
                  next_cursor:
                    type:
                    - string
                    - 'null'
                  total:
                    type:
                    - integer
                    - 'null'
                required:
                - items
                - next_cursor
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /audit-events/{id}:
    get:
      tags:
      - audit
      operationId: auditGet
      summary: Audit event detail (P8.AUD.02)
      x-permission: 'audit.view (branch — rows of the grant''s branches and the rows the caller authored (actor_user_id = caller — reconcile 02/Oct); other branch-less rows company scope;
        pay rows company-scope payroll.view — EMPLOYEE_BALANCE cash-out rows (owner C1 + D-FIN-06): payroll.view or receivable.issue; document rows company-scope employee.documents —
        owner F10)'
      description: Field-level changes with label keys, raw before / after (secrets redacted), related rows with the same request_id (visible only). Hidden row → 404.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditEvent'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /imports:
    get:
      tags:
      - imports
      operationId: importList
      summary: Import jobs (P8.IMP.01)
      x-permission: import.run (company master — company scope)
      parameters:
      - name: status
        in: query
        schema:
          type: array
          items:
            type: integer
            enum:
            - 0
            - 1
            - 2
            - 3
            - 4
            description: 0 CANCELLED · 1 UPLOADED · 2 VALIDATED (preview) · 3 CONFIRMED · 4 FAILED (D-DAT-01)
        description: Repeatable
        style: form
        explode: true
      - name: entity_type
