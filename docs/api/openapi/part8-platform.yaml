          - w400
          - w800
          - w1600
          description: Image variant — WebP widths 400 / 800 / 1600 (contract 11)
      responses:
        '200':
          description: 'Image bytes — public: Cache-Control public, max-age=86400 + ETag (review fix 02/Oct — not one-year immutable); staff session: private, max-age=3600'
          headers:
            Cache-Control:
              schema:
                type: string
            ETag:
              schema:
                type: string
          content:
            image/webp:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
        '304':
          description: Not modified (If-None-Match = the ETag) — answered only while the image is still public (the reference check runs first)
