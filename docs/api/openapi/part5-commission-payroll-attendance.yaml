components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: point_session
      description: Server-side session — D-AUTH-06. Mutating requests also need X-Requested-With (API-AUTH-02).
  parameters:
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
      description: Opaque cursor from next_cursor
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    XRequestedWith:
      name: X-Requested-With
      in: header
      required: true
      schema:
        type: string
        enum:
        - point-app
      description: CSRF guard for cookie-authenticated mutations (API-AUTH-02)
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
      description: client_request_id — one UUID per logical submit, kept across retries (API-IDEM-01, DB Part 5 v1.1 G (b)); missing → 400 idempotency_key_required
  responses:
    ValidationError:
      description: 400 validation · reason_required · idempotency_key_required (errors[] per field)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthenticated:
      description: 401 unauthenticated · session_revoked
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: 403 forbidden (context.required) · out_of_scope · company_scope_required (private level — P5-RULE-01) · earnings_hidden · csrf
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: 404 not_found (unknown id, out-of-scope single read, another employee's or an unpublished payslip)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: 409 invalid_transition · period_overlap · closings_open · run_stale · later_run_exists · earlier_run_open · plan_in_use · assignment_overlap · assignment_scope_conflict
        · assignment_in_use · system_row · already_exists · auto_line · receivable_in_use · cash_out_linked · already_clocked_in · not_clocked_in · attendance_overlap · idempotency_in_progress
        · conflict
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unprocessable:
      description: 422 business rule — codes in docs/api/05-commission-payroll-attendance.md §16 (period_invalid, period_not_ended, net_negative, tiers_invalid, self_action, self_issue,
        qr_invalid, qr_revoked, too_far, gps_inaccurate, manual_only_mode, repayment_exceeds_balance, …)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Locked:
      description: 423 payroll_finalized (PayrollLock — contract 3; a date inside a FINALIZED / PUBLISHED / PAID run) · locked (review writes on a FINALIZED+ run, context.correction_path
        = "reopen")
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Problem:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        code:
          type: string
          description: Language key under error.* (API-ERR-01)
        detail:
          type: string
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              code:
                type: string
              params:
                type: object
                additionalProperties: true
        request_id:
          type: string
          format: uuid
          description: Server-generated UUIDv7 (API-ERR-01)
        context:
          type: object
          additionalProperties: true
          description: 'Machine data (API-ERR-01 v1.4): payroll_finalized → { employee_id, run_id, period: { start, end }, status } · closings_open → { items: [{ branch_id, dates[] }]
            } · run_stale → { changed[] (input groups: sales, refunds, attendance, leaves, shifts, salaries, assignments, receivables, settings, runs), calculated_at } · period_overlap
            / later_run_exists / earlier_run_open → { run_id } · net_negative → { employee_id, net_amount } · tiers_invalid → { reason } · plan_in_use → { active_assignment_count } ·
            too_far → { distance_meters, radius_meters, branch_id } · gps_inaccurate → { accuracy_meters, max_meters } · already_clocked_in → { record_id } · repayment_exceeds_balance
            → { balance_amount } · cash_out_linked → { cash_out_id } · invalid_transition → { status } · locked → { locked_by, locked_at, correction_path: "reopen" } · forbidden → {
            required }'
      required:
      - type
      - title
      - status
      - code
    EmployeeRef:
      type: object
      properties:
        id:
          type: string
          format: uuid
        display_name:
          type: string
        employee_code:
          type:
          - string
          - 'null'
      required:
      - id
      - display_name
    UserRef:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
        display_name:
          type: string
      required:
      - user_id
      - display_name
    Warning:
      type: object
      properties:
        code:
          type: string
          description: override_dropped · override_stale · period_gap · open_exceptions · closings_open · period_not_ended · no_salary · capped · employees_left · pending_leaves · reopened_not_recalculated
            · late · no_shift_today · previous_record_closed · early_leave · absent_voided
        params:
