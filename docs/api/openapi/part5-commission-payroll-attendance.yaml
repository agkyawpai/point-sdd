        dates[] }] } / run_stale { changed[], calculated_at } (changed = the input groups whose inputs_fingerprint hash moved) / earlier_run_open { run_id } / invalid_transition. Run
        warning pending_leaves { count }. Gate (b) = Part 7 DailyClosings.openDays (P7-RULE-03 — days with money activity count even on closure days; from each branch''s first active
        date). Allocation snapshot + Part 7 Expenses.postPayroll(run, actor) (salary = Gross). Idempotent by state.'
