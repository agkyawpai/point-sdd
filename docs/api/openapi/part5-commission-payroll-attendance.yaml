openapi: 3.1.0
info:
  title: Point Barbershop API — Part 5 · Commission, Payroll & Attendance
  version: 1.1.0
  summary: Commission plans and assignments, own earnings, salaries, payroll runs and payslips, advances / loans, attendance clock-in / out, records, exceptions, branch QR
  description: 'Design document for Part 5 (docs/api/05-commission-payroll-attendance.md). Conventions: docs/api/00-conventions.md (v1.5).

    v1.1 (02/Oct/2026) — OPEN-40 locked (owner "OPEN-40 OK"): (a) payroll reopen — Part 7 Expenses.removePayroll(run, actor, reason) soft-deletes the run''s salary expenses (DB Part
    7 v1.2); (b) withdrawing a wrong, unused salary row / plan assignment archives it (DB Part 5 v1.2 — archived_at, archived_by_user_id, `archive_reason`; the overlap constraints
    ignore archived rows). No endpoint, DTO or code changed — description strings only.

    Review fixes 02/Oct (independent review — no version bump): PayrollLock = shared / exclusive advisory lock, callers incl. Part 2 leave / shift writes and Part 4 late-entry START
    + FINISH; reversal carry = AUTO lines only; net base ≤ 0 = no EARN line; estimate window = the payroll period; withdraw raised as OPEN-40 (b) (answered in v1.1 — archive); receivable.issue = private; run_stale =
    inputs_fingerprint, 409 earlier_run_open; reopen keeps MANUAL lines / overrides; LATE / EARLY never inside an ABSENT shift; self clock-in always needs branch coordinates; no write-off
    in V1; Attendance.openRecordOf, Receivables.updateForCashOut.

    Reconcile 02/Oct (cross-part reconcile — no version bump): PayrollLock.finalizedRunFor(date) owned here (read-only); with attendance.gps_required off neither the radius nor the accuracy
    limit is enforced (gps_inaccurate / too_far only when it is on); run_stale { changed[], calculated_at }; locked { locked_by, locked_at, correction_path }.

    v1.0 (02/Oct, batch consistency pass — no version bump): reopen salary-expense step raised as OPEN-40 (a) (answered in v1.1 — soft delete; API unchanged), Expenses.postPayroll(run, actor) / removePayroll(run,
    actor, reason), DailyClosings.openDays per P7-RULE-03, Receivables.cancelForCashOut, QR poster = Part 8 attendance_qr_poster. Fix-up 02/Oct (batch v5.2.15): receivable.changed payload
    ids-only (ADR-008); leave re-detection = Part 2 P2.LV.03 / 05 / 06 / 07 / 08; research labels gap E7 / E8.

    Decisions served: D-COM-01..04, D-PAYR-01..08, D-ATT-01..06, D-FIN-02/04/07/08, D-DSH-03, D-ROLE-02/03/07/09 (ADR-011, ADR-012 + level private), D-NTF-01..03, D-AUD-01/02, D-DAT-05,
    D-DB-03/04/09, D-PLT-04/05/15/16, ADR-002/013.

    Status: v1.1 — LOCKED (D-API-06) — owner one-sheet "အကုန်လုံး OK" (02/Oct/2026 00:06): items C1–C12, G (a)(b) (DB Part 5 v1.1), H; v1.1 = owner "OPEN-40 OK" (02/Oct/2026) — DB
    Part 5 v1.2 (archive columns), DB Part 7 v1.2 (payroll reopen soft delete).

    x-permission on every operation: "<module>.view+" = view or any other code of the module (API-PERM-06); "self" = own data, no code (API-PERM-04); levels: commission, payroll, payroll
    categories, salaries, receivables (reads and receivable.issue) = private (company-scope grant only — a branch-scope grant reaches nothing, 403 company_scope_required); attendance
    records / exceptions / QR = branch data.

    Every staff operation may also return 401 and 503 (maintenance); mutating staff operations need X-Requested-With: point-app (API-AUTH-02). Row-creating money operations with a client_request_id
    column (receivable issue, cash repayment) need Idempotency-Key; state changes (calculate, finalize, publish, mark paid, reopen, cancel) are idempotent by state (contract 15).

    Cross-part functions owned here: PayrollLock.assertNotFinalized(tx, { employee_ids?, dates }) (shared advisory lock; finalize / reopen exclusive — 423 payroll_finalized), the read-only
    lookup PayrollLock.finalizedRunFor(date) (Part 7 reopen warning payroll_finalized_period { run_id, period }), Commission.estimate(employee_id, business_date, base_amount, branch_id,
    before?) (marginal tiers on the payroll period), Receivables.issue(…) / cancelForCashOut(cash_out_id, actor, reason) / updateForCashOut(cash_out_id, { reason }, actor), Attendance.openRecordsAt(branch_id),
    Attendance.openRecordOf(employee_id), AttendanceDetector.

    Conventions reminders: money = integer MMK; timestamps ISO 8601 with +06:30; business dates MMT; status/type = smallint codes (D-DB-03); errors = RFC 9457 problem+json with code
    = language key.'
servers:
- url: /api/v1
  description: Same origin as the app — Caddy routes /api/* to NestJS (ADR-009); none of these routes is forwarded on the public site host
- url: http://localhost:3000/api/v1
  description: Local development through the dev Caddy
tags:
- name: commission-plans
  description: Plans + tiers, versions — D-COM-01 (private)
- name: plan-assignments
  description: Employee plan assignments ("qualify") — D-COM-01 (private)
- name: commission
  description: Commission preview and My earnings — D-COM-04, D-DSH-03
- name: salaries
  description: Salaries, Pay tab, allocation shares — D-PAYR-02/08 (private)
- name: payroll-categories
  description: Earning / deduction categories — D-PAYR-03 (private)
- name: payroll-runs
  description: Run wizard, review, finalize, publish, mark paid, reopen, cancel, admin payslips — D-PAYR-01..08 (private)
- name: receivables
  description: Salary advances and staff loans, repayments, outstanding — D-PAYR-04 (private; own list = self)
- name: payslips
  description: Own payslips (PDF / Excel) — D-PAYR-07
- name: attendance-self
  description: Own clock-in / clock-out (QR + GPS) — D-ATT-01/02
- name: attendance
  description: Records, manual entry, correction, void, evidence, summary, exceptions board — D-ATT-03..06
- name: attendance-qr
  description: Branch attendance QR tokens — D-ATT-01, F-P5-07
security:
- sessionCookie: []
paths:
  /commission-plans:
    get:
      tags:
      - commission-plans
      operationId: commissionPlanList
      summary: Commission plans (P5.COM.01) — AD-PAY-04
      x-permission: commission.view+ (private — company scope only; a branch-scope grant reaches nothing → 403 company_scope_required — P5-RULE-01)
      parameters:
      - name: status
        in: query
        schema:
          type: array
          items:
            type: integer
            enum:
            - 0
            - 1
            description: 0 INACTIVE · 1 ACTIVE
            x-enum-varnames:
            - INACTIVE
            - ACTIVE
        description: Repeatable; default 1
        style: form
        explode: true
      - name: include_archived
        in: query
        schema:
          type: boolean
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/CommissionPlan'
                required:
                - items
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
      - commission-plans
      operationId: commissionPlanCreate
      summary: Create a plan with tiers (P5.COM.02) — D-COM-01
      x-permission: commission.create (private — company scope only; a branch-scope grant reaches nothing → 403 company_scope_required — P5-RULE-01)
      description: Tiers contiguous from 0, last open-ended, rates ≤ 2 decimals (422 tiers_invalid { reason }); name unique among non-archived (409 already_exists).
      parameters:
      - $ref: '#/components/parameters/XRequestedWith'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommissionPlanCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommissionPlan'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /commission-plans/{id}:
    get:
      tags:
      - commission-plans
      operationId: commissionPlanGet
      summary: Plan detail with assignments (P5.COM.03)
      x-permission: commission.view+ (private — company scope only; a branch-scope grant reaches nothing → 403 company_scope_required — P5-RULE-01)
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommissionPlan'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
      - commission-plans
      operationId: commissionPlanUpdate
      summary: Edit a plan (P5.COM.04)
      x-permission: commission.update (private — company scope only; a branch-scope grant reaches nothing → 403 company_scope_required — P5-RULE-01)
      description: tiers only while the plan was never assigned (409 plan_in_use — use new-version). 409 conflict on expected_updated_at.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/XRequestedWith'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommissionPlanUpdate'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommissionPlan'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /commission-plans/{id}/new-version:
    post:
      tags:
      - commission-plans
      operationId: commissionPlanNewVersion
      summary: '"Create a new version" (P5.COM.05) — AD-PAY-04'
      x-permission: commission.create (private — company scope only; a branch-scope grant reaches nothing → 403 company_scope_required — P5-RULE-01)
      description: Copies the plan (name suffixed "v2" unless given) with the new tiers; assignments move by P5.CPA.02 with a new effective_from.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/XRequestedWith'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommissionPlanNewVersion'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommissionPlan'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /commission-plans/{id}/archive:
    post:
      tags:
      - commission-plans
      operationId: commissionPlanArchive
      summary: Archive a plan (P5.COM.06)
      x-permission: commission.delete (private — company scope only; a branch-scope grant reaches nothing → 403 company_scope_required — P5-RULE-01)
      description: 409 plan_in_use { active_assignment_count } while an assignment is open or future.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/XRequestedWith'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommissionPlan'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /commission-plans/{id}/restore:
    post:
      tags:
      - commission-plans
      operationId: commissionPlanRestore
      summary: Restore a plan (P5.COM.07)
      x-permission: commission.delete (private — company scope only; a branch-scope grant reaches nothing → 403 company_scope_required — P5-RULE-01)
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/XRequestedWith'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommissionPlan'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /employee-commission-plans:
    get:
      tags:
      - plan-assignments
      operationId: planAssignmentList
      summary: Plan assignments (P5.CPA.01)
      x-permission: commission.view+ (private — company scope only; a branch-scope grant reaches nothing → 403 company_scope_required — P5-RULE-01)
      parameters:
      - name: employee_id
        in: query
        schema:
          type: string
          format: uuid
      - name: commission_plan_id
        in: query
        schema:
          type: string
          format: uuid
      - name: branch_id
        in: query
        schema:
          type: string
          format: uuid
        description: Branch-scope rows of this branch
      - name: active_on
        in: query
        schema:
          type: string
          format: date
        description: Rows effective on this date
      - name: include_ended
        in: query
        schema:
          type: boolean
        description: Default false = current and future rows
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/PlanAssignment'
                required:
                - items
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
      - plan-assignments
      operationId: planAssignmentCreate
      summary: Assign a plan — "qualify" (P5.CPA.02) — D-COM-01, owner C5
      x-permission: commission.assign (private — company scope only; a branch-scope grant reaches nothing → 403 company_scope_required — P5-RULE-01)
      description: P5-RULE-03 effective-dated algorithm (past dates allowed down to the open payroll period). 409 assignment_overlap / assignment_scope_conflict · 422 plan_inactive /
        not_assigned_to_branch · 423 payroll_finalized.
      parameters:
      - $ref: '#/components/parameters/XRequestedWith'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanAssignmentCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanAssignment'
        '200':
          description: Updated in place (a row with the same effective_from existed — P5-RULE-03)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanAssignment'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '423':
          $ref: '#/components/responses/Locked'
  /employee-commission-plans/{id}:
    patch:
      tags:
      - plan-assignments
      operationId: planAssignmentUpdate
      summary: End or correct an assignment (P5.CPA.03)
      x-permission: commission.assign (private — company scope only; a branch-scope grant reaches nothing → 403 company_scope_required — P5-RULE-01)
      description: effective_to ≥ the last finalized period end (423 payroll_finalized); plan / branch only while unused (409 assignment_in_use).
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/XRequestedWith'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanAssignmentUpdate'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanAssignment'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '423':
          $ref: '#/components/responses/Locked'
  /employee-commission-plans/{id}/withdraw:
    post:
      tags:
      - plan-assignments
      operationId: planAssignmentWithdraw
      summary: Withdraw a wrong assignment (P5.CPA.04)
      x-permission: commission.assign (private — company scope only; a branch-scope grant reaches nothing → 403 company_scope_required — P5-RULE-01)
      description: 'Unused (no commission result of a FINALIZED / PUBLISHED / PAID run) and after the last finalized period only; previous row re-linked. Mechanism = archive (owner 02/Oct/2026
        — OPEN-40 OK): DB Part 5 v1.2 archived_at / archived_by_user_id / `archive_reason`, the overlap EXCLUDE ignores archived rows (WHERE archived_at IS NULL) — the row is archived,
        never deleted (D-DAT-05). Audit commission.assignment_withdraw with the before-image.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/XRequestedWith'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReasonBody'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  withdrawn_id:
                    type: string
                    format: uuid
                  previous:
                    oneOf:
                    - $ref: '#/components/schemas/PlanAssignment'
                    - type: 'null'
                required:
                - withdrawn_id
                - previous
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '423':
          $ref: '#/components/responses/Locked'
  /commission/preview:
    get:
      tags:
      - commission
      operationId: commissionPreview
      summary: Monthly commission preview — not stored (P5.CMS.01)
      x-permission: commission.view+ (private — company scope only; a branch-scope grant reaches nothing → 403 company_scope_required — P5-RULE-01)
      description: P5-RULE-02 engine on live data (REPEATABLE READ READ ONLY snapshot — ADR-015). month = the MONTHLY payroll period (D-PAYR-01); with another payroll.period_type one
        item per payroll period overlapping the month. Final figures exist only in a payroll run (D-COM-04).
      parameters:
      - name: month
        in: query
        schema:
          type: string
          pattern: ^[0-9]{4}-(0[1-9]|1[0-2])$
          description: YYYY-MM (MMT)
        required: true
      - name: employee_id
        in: query
        schema:
          type: string
          format: uuid
      - name: branch_id
        in: query
        schema:
          type: string
          format: uuid
        description: Branch-scope assignments of this branch / sales of this branch
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  month:
                    type: string
                    pattern: ^[0-9]{4}-(0[1-9]|1[0-2])$
                    description: YYYY-MM (MMT)
                  generated_at:
                    type: string
                    format: date-time
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/CommissionPreviewItem'
                required:
                - month
                - generated_at
                - items
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /me/earnings:
    get:
      tags:
      - commission
      operationId: myEarnings
      summary: My earnings — own sales and commission estimate (P5.CMS.02) — AD-DSH-01
      x-permission: self — effective own-earnings flag ON (P1-RULE-06), else 403 earnings_hidden
      description: Never colleagues' figures (AD-PERM-05). Estimate = tiers on the period-to-date base of the payroll period containing today (the month for MONTHLY periods — owner C12;
        null for a past month under a non-monthly period type); final figures once the run is published.
      parameters:
      - name: month
        in: query
        schema:
          type: string
          pattern: ^[0-9]{4}-(0[1-9]|1[0-2])$
          description: YYYY-MM (MMT)
        description: Default = current month (MMT)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyEarnings'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /employees/{id}/pay:
    get:
      tags:
      - salaries
      operationId: employeePay
      summary: Employee Pay tab summary (P5.EPY.01) — AD-EMP-02
      x-permission: payroll.view+ (private — company scope only; a branch-scope grant reaches nothing → 403 company_scope_required — P5-RULE-01)
      description: commission_assignments only when the caller also holds commission.view+ (company scope); otherwise omitted.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Employee id
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeePay'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /employees/{id}/salaries:
    get:
      tags:
      - salaries
      operationId: salaryHistory
      summary: Salary history (P5.EPY.02) — D-PAYR-02
      x-permission: payroll.view+ (private — company scope only; a branch-scope grant reaches nothing → 403 company_scope_required — P5-RULE-01)
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Employee id
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Salary'
                required:
                - items
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags:
      - salaries
      operationId: salarySet
      summary: Set a salary from a date (P5.EPY.03) — owner C5
      x-permission: payroll.update (private — company scope only; a branch-scope grant reaches nothing → 403 company_scope_required — P5-RULE-01)
      description: Monthly amount (F-P5-12); P5-RULE-03 algorithm; effective_from on or before the last finalized period end → 423 payroll_finalized.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Employee id
      - $ref: '#/components/parameters/XRequestedWith'
      requestBody:
        required: true
        content:
          application/json:
            schema:
