        / published_at (+ their users, rules_snapshot) cleared; the entries, lines, items and commission results stay as working rows until the next Calculate rebuilds them, re-applying
        MANUAL lines and overrides (F-P5-09; warning reopened_not_recalculated). Exclusive payroll lock first. Interceptor audit row payroll.reopen carries the run''s full before-image.
