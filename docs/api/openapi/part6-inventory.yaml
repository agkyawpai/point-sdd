openapi: 3.1.0
info:
  title: Point Barbershop API — Part 6 · Inventory
  version: 1.1.0
  summary: Products, suppliers, stock levels and ledger, barber usage, adjustments, purchases, two-step transfers, stock counts
  description: 'Design document for Part 6 (docs/api/06-inventory.md). Conventions: docs/api/00-conventions.md (v1.5 — incl. the idempotency wording of contract 15).

    v1.1 (02/Oct/2026) — OPEN-40 locked (owner "OPEN-40 OK"): (c) lines removed when the lines of a DRAFT purchase / DRAFT transfer are replaced are deleted with a full audit diff
    (the reading of owner answer A2 for booking items); no DB change. No endpoint, DTO or code changed — description strings only.

    v1.0 (02/Oct, batch consistency pass — no version bump): Expenses.createAuto signature = Part 7, D3 correction = P7.EXP.07 + P7.EXP.03, usage double tap findable through Part 4 P4.REQ.01
    (stock_movement); research items written "research E…".

    Decisions served: D-STK-01..06 (REC-14), D-PAY-03/05, D-FIN-02/03/05/07/08, D-DAT-05, D-NTF-01..03, D-AUD-01/02, D-ROLE-02/03/07/09 (ADR-011, ADR-012), D-DB-10 (F-P6-01..09) / D-DB-11
    (F-P7-05), D-PLT-15/16.

    Review fixes 02/Oct (independent review — no version bump): whole-branch count = every ACTIVE product (no level row → expected 0); interceptor audit only (no DB audit trigger on
    Part 6 tables); draft / count child writes lock the header row; post_requested derived from the audit row; POSTED purchase writes = 409 invalid_transition (no 423); empty items =
    400 validation (items_required dropped); previous_month_pnl { date }; balance_after in (occurred_at, id) order; TransferReceive.note dropped; lock order = day lock → payroll lock
    → sale → visit → booking → payments → receipt counter → cash-out / closing rows → purchase / transfer / count row → stock level rows last; removed draft lines raised as OPEN-40 (c) (answered in v1.1 — deleted with a full audit diff).

    Reconcile 02/Oct (cross-part reconcile — no version bump): edits / line writes on a SENT / RECEIVED / CANCELLED transfer = 409 invalid_transition like a POSTED purchase — this part
    answers no 423.

    Status: 🔒 LOCKED v1.1 — D-API-07 (owner one-sheet "အကုန်လုံး OK", 02/Oct/2026 00:06 — D1–D9, B8 a, G (c), H; v1.1 = owner "OPEN-40 OK", 02/Oct/2026 — (c)). DB Part 6 v1.2 (stock_movements.client_request_id).

    x-permission on every operation: "<module>.view+" = view or any other code of the module (API-PERM-06); "any staff (read scope)" = operational read, no code; "self" = own rows; levels
    per ADR-012: categories / products / suppliers / adjustment reasons = company master; levels, movements, usage, adjustments, counts = branch data; purchases = branch data per line
    (read: any line in scope · write: every line); transfers = branch data on two branches (read: either · draft / send / cancel: sending · receive: receiving, or the receiver — owner
    D4).

    Every staff operation may also return 401 and 503 (maintenance); mutating operations need X-Requested-With: point-app (API-AUTH-02). Idempotency-Key is required only on stock usage
    and manual adjustment (stock_movements.client_request_id — sheet G (c)); post / send / receive / count post are idempotent by state.

    Conventions reminders: money = integer MMK; quantities = integer pcs; timestamps ISO 8601 with +06:30; business dates MMT; status / type = smallint codes (D-DB-03); errors = RFC
    9457 problem+json with code = language key.'
servers:
- url: /api/v1
  description: Same origin as the app — Caddy routes /api/* to NestJS (ADR-009)
- url: http://localhost:3000/api/v1
  description: Local development through the dev Caddy
tags:
- name: product-categories
  description: Product categories — F-P6-01 (company master)
- name: products
  description: Products — F-P6-02, D-PAY-03 (company master) + operational picker
- name: suppliers
  description: Suppliers — D-STK-02 (company master)
- name: adjustment-reasons
  description: Stock adjustment reasons — D-STK-05 (company master, disable only)
- name: stock
  description: Stock levels, movement ledger, barber usage, manual adjustments — D-STK-01/04/05/06 (branch data)
- name: purchases
  description: Purchases — D-STK-02, owner D1–D3 (branch data per line)
- name: transfers
  description: Two-step transfers — D-STK-03 / REC-14, owner D4 / D5 (two branches)
- name: counts
  description: Stock counts — D-STK-05, owner D8 / D9 (branch data)
security:
- sessionCookie: []
paths:
  /product-categories:
    get:
      tags:
      - product-categories
      operationId: productCategoryList
      summary: Product categories (P6.CAT.01) — F-P6-01
      x-permission: any staff (read scope) — operational for ACTIVE rows; status=0 or include_archived=true -> product.view+ (company master, read-only at branch scope)
      parameters:
      - name: status
        in: query
        schema:
          type: array
          items:
            type: integer
            enum:
            - 0
            - 1
            description: 0 INACTIVE · 1 ACTIVE
        description: Repeatable; default 1
        style: form
        explode: true
      - name: include_archived
        in: query
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProductCategory'
                required:
                - items
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
      - product-categories
      operationId: productCategoryCreate
      summary: Add a product category (P6.CAT.02)
      x-permission: product.create (company master — company scope)
      description: Name unique among non-archived (409 already_exists).
      parameters:
      - $ref: '#/components/parameters/XRequestedWith'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductCategoryCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductCategory'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /product-categories/order:
    put:
      tags:
      - product-categories
      operationId: productCategoryReorder
      summary: Reorder categories (P6.CAT.06)
      x-permission: product.update (company master — company scope)
      description: Must contain every non-archived id (400 validation).
      parameters:
      - $ref: '#/components/parameters/XRequestedWith'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ids:
                  type: array
                  items:
                    type: string
                    format: uuid
                  minItems: 1
              required:
              - ids
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProductCategory'
                required:
                - items
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /product-categories/{id}:
    patch:
      tags:
      - product-categories
      operationId: productCategoryUpdate
      summary: Edit a category (P6.CAT.03)
      x-permission: product.update (company master — company scope)
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/XRequestedWith'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductCategoryUpdate'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductCategory'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /product-categories/{id}/archive:
    post:
      tags:
      - product-categories
      operationId: productCategoryArchive
      summary: Archive a category (P6.CAT.04)
      x-permission: product.delete (company master — company scope)
      description: 409 category_in_use { count } while non-archived products belong to it.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/XRequestedWith'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductCategory'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /product-categories/{id}/restore:
    post:
      tags:
      - product-categories
      operationId: productCategoryRestore
      summary: Restore a category (P6.CAT.05)
      x-permission: product.delete (company master — company scope)
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/XRequestedWith'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductCategory'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /products:
    get:
      tags:
      - products
      operationId: productList
      summary: Products list (P6.PRD.01) — AD-STK-01
      x-permission: product.view+ (company master — any scope, read-only at branch scope)
      parameters:
      - name: q
        in: query
        schema:
          type: string
        description: Name (MM / EN) or SKU
      - name: category_id
        in: query
        schema:
          type: string
          format: uuid
      - name: sellable
        in: query
        schema:
          type: boolean
      - name: status
        in: query
        schema:
          type: array
          items:
            type: integer
            enum:
            - 0
            - 1
            description: 0 INACTIVE · 1 ACTIVE
        description: Repeatable; default 1
        style: form
        explode: true
      - name: include_archived
        in: query
        schema:
          type: boolean
          default: false
      - name: branch_id
        in: query
        schema:
          type: string
          format: uuid
        description: Adds the stock at this branch to each row (branch must be in the caller read scope, else the stock part is null)
      - name: sort
        in: query
        schema:
          type: string
          enum:
          - name
          - category
          - -updated_at
          default: category
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProductListItem'
                  next_cursor:
                    type:
                    - string
                    - 'null'
                  total:
                    type:
                    - integer
                    - 'null'
                required:
                - items
                - next_cursor
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
      - products
      operationId: productCreate
      summary: Add a product (P6.PRD.03) — F-P6-02
      x-permission: product.create (company master — company scope)
      description: Sellable ⇒ sell_price_amount required; shop-use ⇒ no price (400 validation — DB products_sell_price_chk). 409 already_exists (name / SKU among non-archived). 422 category_inactive.
      parameters:
      - $ref: '#/components/parameters/XRequestedWith'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /products/picker:
    get:
      tags:
      - products
      operationId: productPicker
      summary: Product picker with stock at one branch (P6.PRD.02) — AD-POS-04, AD-STK-05
      x-permission: any staff (read scope) — operational
      parameters:
      - name: branch_id
        in: query
        schema:
          type: string
          format: uuid
        description: Branch in the caller read scope (else empty list)
        required: true
      - name: purpose
        in: query
        schema:
          type: string
          enum:
          - sale
          - usage
          - purchase
          - transfer
          - adjust
          - count
        description: sale = ACTIVE sellable only · usage = ACTIVE, shop-use first, the caller's 5 most recent usages on top (owner D7) · others = ACTIVE (transfer / adjust / count also
          list INACTIVE products with stock ≠ 0)
        required: true
      - name: q
        in: query
        schema:
          type: string
        description: Name or SKU (exact SKU match first — barcode)
      - name: category_id
        in: query
        schema:
          type: string
          format: uuid
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 100
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProductPick'
                required:
                - items
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /products/{id}:
    get:
      tags:
      - products
      operationId: productGet
      summary: Product detail + stock per branch (P6.PRD.04)
      x-permission: product.view+ (company master — any scope)
      description: branches[] = the branches in the caller read scope; last_unit_cost_amount only for purchase.view+ holders (else null).
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
      - products
      operationId: productUpdate
      summary: Edit a product (P6.PRD.05)
      x-permission: product.update (company master — company scope)
      description: 'is_sellable false ⇒ the price is cleared; true ⇒ sell_price_amount required. New price applies to lines added from now (sale lines keep their snapshot). status 0
        = INACTIVE: no new sales / purchases; stock can still be moved, counted, adjusted.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/XRequestedWith'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductUpdate'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /products/{id}/archive:
    post:
      tags:
      - products
      operationId: productArchive
      summary: Archive a product (P6.PRD.06) — D-DAT-05, AD-STK-01
      x-permission: product.delete (company master — company scope)
      description: '409 product_has_stock { branches: [{ branch_id, quantity }], in_transit_quantity } while any branch quantity ≠ 0 or a SENT transfer carries it (research E8) · 409
        product_in_open_documents { purchases, transfers, counts, sales } while a DRAFT purchase / DRAFT transfer / IN_PROGRESS count / OPEN sale line has it.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/XRequestedWith'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /products/{id}/restore:
    post:
      tags:
      - products
      operationId: productRestore
      summary: Restore a product (P6.PRD.07)
      x-permission: product.delete (company master — company scope)
      description: 409 already_exists when the name / SKU is now taken.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/XRequestedWith'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /suppliers:
    get:
      tags:
      - suppliers
      operationId: supplierList
      summary: Suppliers list (P6.SUP.01)
      x-permission: supplier.view+ (company master — any scope, read-only at branch scope)
      parameters:
      - name: q
        in: query
        schema:
          type: string
      - name: status
        in: query
        schema:
          type: array
          items:
            type: integer
            enum:
            - 0
            - 1
            description: 0 INACTIVE · 1 ACTIVE
        description: Repeatable; default 1
        style: form
        explode: true
      - name: include_archived
        in: query
        schema:
          type: boolean
          default: false
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Supplier'
                  next_cursor:
                    type:
                    - string
                    - 'null'
                  total:
                    type:
                    - integer
                    - 'null'
                required:
                - items
                - next_cursor
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
      - suppliers
      operationId: supplierCreate
      summary: Add a supplier (P6.SUP.03)
      x-permission: supplier.create (company master — company scope)
      description: Name unique among non-archived (409 already_exists).
      parameters:
      - $ref: '#/components/parameters/XRequestedWith'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SupplierCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Supplier'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /suppliers/picker:
    get:
      tags:
      - suppliers
      operationId: supplierPicker
      summary: Supplier picker for the purchase form (P6.SUP.02)
      x-permission: any staff (read scope) — operational
      description: ACTIVE, non-archived suppliers — id + name only.
      parameters:
      - name: q
        in: query
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/SupplierPick'
                required:
                - items
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /suppliers/{id}:
    get:
      tags:
      - suppliers
      operationId: supplierGet
      summary: Supplier detail (P6.SUP.04)
      x-permission: supplier.view+ (company master — any scope)
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Supplier'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
      - suppliers
      operationId: supplierUpdate
      summary: Edit a supplier (P6.SUP.05)
      x-permission: supplier.update (company master — company scope)
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/XRequestedWith'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SupplierUpdate'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Supplier'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /suppliers/{id}/archive:
    post:
      tags:
      - suppliers
      operationId: supplierArchive
      summary: Archive a supplier (P6.SUP.06)
      x-permission: supplier.delete (company master — company scope)
      description: Purchases keep the reference; the picker no longer offers it.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/XRequestedWith'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Supplier'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /suppliers/{id}/restore:
    post:
      tags:
      - suppliers
      operationId: supplierRestore
      summary: Restore a supplier (P6.SUP.07)
      x-permission: supplier.delete (company master — company scope)
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/XRequestedWith'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Supplier'
        '401':
