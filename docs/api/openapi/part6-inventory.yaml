          type: string
          format: uuid
        name_mm:
          type: string
        name_en:
          type:
          - string
          - 'null'
        sort_order:
          type: integer
        status:
          type: integer
          enum:
          - 0
          - 1
          description: 0 INACTIVE · 1 ACTIVE
