                  description: updated_at the client last read — mismatch → 409 conflict (API-IDEM-04)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockCountWithWarnings'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /stock-counts/{id}/cancel:
    post:
      tags:
      - counts
      operationId: countCancel
      summary: Cancel a count (P6.CNT.08)
      x-permission: stock.count (branch data)
      description: IN_PROGRESS → 0 CANCELLED; nothing is posted. POSTED → 409 invalid_transition.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/XRequestedWith'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  minLength: 1
                  maxLength: 1000
              required:
              - reason
              description: Reason stored in the audit row (no DB column) — 400 reason_required when empty
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockCount'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: point_session
      description: Server-side session — D-AUTH-06. Mutating requests also need X-Requested-With (API-AUTH-02).
  parameters:
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
      description: Opaque cursor from next_cursor
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    XRequestedWith:
      name: X-Requested-With
      in: header
      required: true
      schema:
        type: string
        enum:
        - point-app
      description: CSRF guard for cookie-authenticated mutations (API-AUTH-02)
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
      description: client_request_id — one UUID per logical submit, kept across retries (API-IDEM-01 v1.5, sheet G (c), 🔒 D-VIS-10); stored on stock_movements.client_request_id; missing
        → 400 idempotency_key_required
  responses:
    ValidationError:
      description: 400 validation (incl. an empty items list) · reason_required · idempotency_key_required (errors[] per field)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthenticated:
      description: 401 unauthenticated · session_revoked
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: 403 forbidden (context.required names the missing code) · out_of_scope (a line / branch outside the grant) · company_scope_required (ADR-012) · csrf
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: 404 not_found (unknown id, out-of-scope single read)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: 409 invalid_transition (every write on a POSTED purchase and every edit / line write / cancel on a SENT, RECEIVED or CANCELLED transfer — context.correction_path for
        a POSTED purchase and a SENT transfer) · conflict (expected_updated_at) · already_exists · duplicate_line · already_in_count · category_in_use · product_has_stock · product_in_open_documents
        · count_in_progress · total_changed · reason_in_use_by_setting · idempotency_in_progress
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unprocessable:
      description: 422 business rule — codes in docs/api/06-inventory.md §12 (product_inactive, product_archived, category_inactive, supplier_inactive, reason_inactive, date_in_future,
        same_branch, receiver_not_at_branch, branch_required, nothing_to_count, count_incomplete, idempotency_mismatch)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Problem:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        code:
          type: string
          description: Language key under error.* (API-ERR-01)
        detail:
          type: string
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              code:
                type: string
              params:
                type: object
                additionalProperties: true
        request_id:
          type: string
          format: uuid
          description: Server-generated UUIDv7 (API-ERR-01)
        context:
          type: object
          additionalProperties: true
          description: 'Machine data (API-ERR-01 v1.4): product_has_stock → { branches[], in_transit_quantity } · product_in_open_documents → { purchases, transfers, counts, sales }
            · count_in_progress → { count_id } · count_incomplete → { uncounted } · total_changed → { total_amount } · branch_required → { branch_ids } · reason_in_use_by_setting → {
            key } · category_in_use → { count } · invalid_transition → { status, correction_path? }'
      required:
      - type
      - title
      - status
      - code
    Warning:
      type: object
      properties:
        code:
          type: string
          description: negative_stock { branch_id, product_id, quantity_on_hand } · low_stock { branch_id, product_id, quantity_on_hand, threshold } · previous_month_pnl { date } (same
            code and context as Part 7) · over_received { item_id, over } · short_received { item_id, short } · inactive_product { product_id }
        params:
          type: object
          additionalProperties: true
      required:
      - code
    ProductCategory:
      type: object
