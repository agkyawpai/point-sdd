components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: point_session
      description: Server-side session — D-AUTH-06. Mutating requests also need X-Requested-With (API-AUTH-02).
  parameters:
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
      description: Opaque cursor from next_cursor
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    XRequestedWith:
      name: X-Requested-With
      in: header
      required: true
      schema:
        type: string
        enum:
        - point-app
      description: CSRF guard for cookie-authenticated mutations (API-AUTH-02)
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
      description: client_request_id — one UUID per logical submit, kept across retries (API-IDEM-01, AD-NET-01, 🔒 D-VIS-10); missing → 400 idempotency_key_required
  responses:
    ValidationError:
      description: 400 validation · reason_required · phone_invalid · idempotency_key_required · invalid_regex (errors[] per field)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthenticated:
      description: 401 unauthenticated · session_revoked
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: 403 forbidden (context.required names the missing code) · out_of_scope · company_scope_required (ADR-012) · csrf
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: 404 not_found (unknown id, out-of-scope single read)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: 409 invalid_transition (context.correction_path on a FINISHED sale where P4-RULE-01 names a correction — omitted for a payment add on a FINISHED sale and for every write on a CANCELLED sale, v1.1) · duplicate_reference (payments — effective method) · discount_request_pending · total_changed
        · already_exists · code_in_use · system_row · idempotency_in_progress · conflict
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unprocessable:
      description: 422 business rule — codes in docs/api/04-visits-sales-payments.md §11 (day_closed, unpaid_visit_open, amount_mismatch, service_required, discount_code_invalid, once_per_customer,
        customer_required_for_discount, self_approval, refund_exceeds_remaining, difference_line_type, …)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Locked:
      description: 423 payroll_finalized (Part 5 PayrollLock — late-entry START, FINISH with SERVICE lines, PERFORMER adjustment) · locked (only the DB guard finished_immutable — the
        services answer 409 invalid_transition first, P4-RULE-01)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Problem:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        code:
          type: string
          description: Language key under error.* (API-ERR-01)
        detail:
          type: string
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              code:
                type: string
              params:
                type: object
                additionalProperties: true
        request_id:
          type: string
          format: uuid
          description: Server-generated UUIDv7 (API-ERR-01)
        context:
          type: object
          additionalProperties: true
          description: 'Machine data (API-ERR-01 v1.4): day_closed → { branch_id, business_date, closed_at, closed_by, correction_path: "reopen" } (Part 7) · unpaid_visit_open → { visit_id
            } · amount_mismatch → { remaining_amount } · total_changed → { total_amount } · duplicate_reference → { receipt_number } · discount_code_invalid → { reason } · refund_exceeds_remaining
            → { sale_item_id (null = sale-level cap), remaining_amount } · payroll_finalized → { employee_id, run_id, period: { start, end }, status } (Part 5) · invalid_transition →
            { status, visit_id?, correction_path? } (correction_path on a FINISHED sale: adjustment | refund | difference_sale — P4-RULE-01; omitted for a payment add on a FINISHED sale and for every write on a CANCELLED sale — v1.1) · forbidden → { required }'
      required:
      - type
      - title
      - status
      - code
    EmployeeRef:
      type: object
      properties:
        id:
          type: string
          format: uuid
        display_name:
          type: string
      required:
      - id
      - display_name
    UserRef:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
        display_name:
          type: string
      required:
      - user_id
      - display_name
    PaymentMethodRef:
      type: object
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name_mm:
          type: string
        name_en:
          type:
          - string
          - 'null'
        kind:
          type: integer
          enum:
          - 1
          - 2
          - 3
          - 4
          description: 1 CASH · 2 MOBILE_WALLET · 3 BANK_TRANSFER · 4 CARD
          x-enum-varnames:
          - CASH
          - MOBILE_WALLET
          - BANK_TRANSFER
          - CARD
      required:
      - id
      - code
      - name_mm
      - kind
    Warning:
      type: object
      properties:
        code:
          type: string
          description: not_eligible (walk-in service the barber is not eligible for — recorded anyway) · negative_stock · booked_price_kept / performer_price_lower (owner B4) · customer_restored
            · customer_reactivated · pending_request_cancelled
        params:
          type: object
          additionalProperties: true
      required:
      - code
    ReasonBody:
      type: object
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 1000
          description: Free-text reason (AD-RSN-02 source F) — 400 reason_required when blank
      required:
      - reason
    ItemRef:
      type: object
      properties:
        service_id:
          type: string
          format: uuid
        service_variant_id:
          type:
          - string
          - 'null'
          format: uuid
          description: Required for OPTIONS services (variant_required)
      required:
      - service_id
    LateEntry:
      type: object
      properties:
        reason:
          type: integer
          enum:
          - 1
          - 2
          - 3
          - 4
          - 9
          description: 1 INTERNET_OUTAGE · 2 POWER_OUTAGE · 3 PHONE_BROKEN · 4 FORGOT · 9 OTHER (note required) — D-VIS-13
          x-enum-varnames:
          - INTERNET_OUTAGE
          - POWER_OUTAGE
          - PHONE_BROKEN
          - FORGOT
          - OTHER
        note:
          type:
          - string
          - 'null'
          maxLength: 1000
          description: Required when reason = 9 OTHER
        started_at:
          type: string
          format: date-time
          description: Actual start (performed_at — D-VIS-13); ≤ now; its MMT date must be an open branch-day (owner B11)
      required:
      - reason
      - started_at
    StartVisitRequest:
      type: object
      properties:
        branch_id:
          type: string
          format: uuid
        booking_id:
          type:
          - string
          - 'null'
          format: uuid
          description: Start from a BOOKED booking of this branch dated today (or the late-entry date) — booking items become SERVICE lines
        performed_by_employee_id:
          type:
          - string
          - 'null'
          format: uuid
          description: Actual service barber; default = the booked barber (booking) or the caller (walk-in) — D-AUTH-07
        proxy_reason:
          type:
          - integer
          - 'null'
          enum:
          - 1
          - 2
          - null
          description: 'Required when the performer is not the caller (D-VIS-04/12); no note field (§10.6 #16)'
        performer_change_reason:
          type:
          - string
          - 'null'
          maxLength: 1000
          description: Required when the performer ≠ the booked barber (D-VIS-04)
        location_type:
          type: integer
          enum:
          - 1
          - 2
          description: Walk-in only (a booking brings its own location)
          x-enum-varnames:
          - BRANCH
          - HOME
        home_address:
          type:
          - string
          - 'null'
          maxLength: 1000
          description: Walk-in HOME only (required)
        items:
          type: array
          items:
            $ref: '#/components/schemas/ItemRef'
          description: 'Walk-in: optional first services (D-VIS-02 — service optional at START); ignored for a booking'
        late_entry:
          oneOf:
          - $ref: '#/components/schemas/LateEntry'
          - type: 'null'
          description: Record a past service — needs sale.late_entry (D-VIS-13)
      required:
      - branch_id
    CompleteRequest:
      type: object
      properties:
        completed_at:
          type:
          - string
          - 'null'
          format: date-time
          description: 'Late-entry visits: REQUIRED (400 validation when missing; ≥ started_at, ≤ now); otherwise ignored = now'
    CommissionEstimate:
      type: object
      properties:
        estimate_amount:
          type: integer
          minimum: 0
          description: Whole MMK (D-PLT-04, API-DATA-02)
        base_amount:
          type: integer
          minimum: 0
          description: Net SERVICE lines of this sale for the performer (D-COM-02)
        month_to_date_base_amount:
          type: integer
          minimum: 0
          description: 'Period-to-date commissionable base of the performer in the payroll period containing the sale business date (MONTHLY = the month), from sales finished before
            this sale (an OPEN sale: everything finished so far) — P4-RULE-20'
        note:
          type: string
          enum:
          - final_at_month_end
      required:
      - estimate_amount
      - base_amount
      - month_to_date_base_amount
      - note
      description: Part 5 Commission.estimate(employee_id, business_date, base_amount, branch_id = the sale branch, before = finished_at) — marginal tiers (owner C12); only for the performer
