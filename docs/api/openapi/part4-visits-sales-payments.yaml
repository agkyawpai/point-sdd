openapi: 3.1.0
info:
  title: Point Barbershop API — Part 4 · Visits, Sales & Payments
  version: 1.1.0
  summary: Walk-in / booking START, service and product lines, checkout, payments, discounts, FINISH, receipts, refunds, adjustments, payment methods
  description: 'Design document for Part 4 (docs/api/04-visits-sales-payments.md). Conventions: docs/api/00-conventions.md (v1.6).

    v1.1 (02/Oct/2026 13:08 — owner sheet 3, review §0.11; no path, schema or permission code changed): context.correction_path is omitted for a payment add on a FINISHED sale and for every write on a CANCELLED sale (P4-RULE-01, S17); the reason fields of this document (reason, added_reason, override_reason, …) are the binding shapes (API-DATA-11 v1.6, S8).

    v1.0 (02/Oct, batch consistency pass — no version bump): Commission.estimate with branch_id, collector list = Attendance.openRecordsAt, StockLedger.post signature, request lookup
    incl. stock_movement, day_closed / payroll_finalized context = Parts 7 / 5.

    Review fixes 02/Oct (independent review — no version bump): one lock order (day lock → payroll lock → sale → visit → booking → … → stock) and READ COMMITTED for money writes; PayrollLock
    on late-entry START and on FINISH with SERVICE lines; difference sale defined (link = type-9 adjustment token); approved discount = lines at approval, removable; reference uniqueness
    on the effective method; refund caps; late-entry timestamps required; once_per_customer = 422; writes on a FINISHED / CANCELLED sale = 409 invalid_transition + correction_path; Commission.estimate(employee_id,
    business_date, base_amount, branch_id, before?).

    Reconcile 02/Oct (cross-part reconcile — no version bump): refund caps per D-PAY-05 — kind 1 ≤ the sale total (line ≤ its net); a manual kind-2 return needs sale.refund + reason
    + external_reference and is ≤ max(sale total, Σ non-voided non-cash payments); kind 2 never consumes the kind-1 cap.

    Decisions served: D-VIS-01..13, D-PAY-01..09, D-SVC-04..06/08, D-COM-02..04, D-KPI-01/02, D-DSH-03, D-ROLE-02/03/07/09 (ADR-011, ADR-012), D-NTF-01..03, D-AUD-01/02, D-DAT-05, D-DB-03/08,
    D-PLT-15, ADR-002/003/013.

    Status: v1.0 — LOCKED (D-API-05) — owner one-sheet "အကုန်လုံး OK" (02/Oct/2026 00:06): items B1–B12, G (DB Part 4 v1.2 guard triggers), H.

    x-permission on every operation: "<module>.view+" = view or any other code of the module (API-PERM-06); "any staff (read scope)" = operational read, no code; "self" = the caller
    is the actor of that visit / sale (P4-RULE-03 — own work needs no code); levels per ADR-012: visits, sales, payments, refunds, adjustments, discount requests = branch data; discount
    codes and payment methods = company master; customers = shared (Part 3).

    Every staff operation may also return 401 and 503 (maintenance); mutating staff operations need X-Requested-With: point-app (API-AUTH-02). Row-creating money operations need Idempotency-Key
    (= client_request_id — API-IDEM-01/02): replay → 200 + Idempotent-Replayed, in progress → 409 idempotency_in_progress, different identifying fields → 422 idempotency_mismatch. FINISH
    and other state changes are idempotent by state check.

    Conventions reminders: money = integer MMK; timestamps ISO 8601 with +06:30; business dates MMT; status/type = smallint codes (D-DB-03); errors = RFC 9457 problem+json with code
    = language key.'
servers:
- url: /api/v1
  description: Same origin as the app — Caddy routes /api/* to NestJS (ADR-009); none of these routes is forwarded on the public site host
- url: http://localhost:3000/api/v1
  description: Local development through the dev Caddy
tags:
- name: visits
  description: START / COMPLETE / INCOMPLETE, Today, visits list — D-VIS-01..13
- name: sales
  description: 'Sale document: lines, price override, discount code, FINISH, product-only and difference sales — D-PAY-03..08, D-SVC-04'
- name: payments
  description: Cash / KBZPay / split, void, collected by, KBZPay verification — D-PAY-01/02, D-VIS-06
- name: discount-codes
  description: Discount code master (company) — D-PAY-04
- name: discount-requests
  description: In-app discount approval — D-PAY-04
- name: refunds
  description: Sale refunds and overpayment returns, RF series — D-PAY-05
- name: adjustments
  description: Correction ledger after FINISH — F-P4-07
- name: receipts
  description: Receipt view / PDF / print image, reprint, lookup — D-PAY-06/07
- name: payment-methods
  description: Payment methods master list (company) — D-PAY-01
security:
- sessionCookie: []
paths:
  /visits:
    get:
      tags:
      - visits
      operationId: visitList
      summary: Visits list (P4.VIS.01) — AD-POS-15 open / finished / incomplete with flags
      x-permission: visit.view+ (branch data — scope-filtered)
      parameters:
      - name: branch_id
        in: query
        schema:
          type: string
          format: uuid
      - name: from
        in: query
        schema:
          type: string
          format: date
        description: Business date (visit START date); default today
      - name: to
        in: query
        schema:
          type: string
          format: date
        description: Business date; default today
      - name: performed_by_employee_id
        in: query
        schema:
          type: string
          format: uuid
      - name: status
        in: query
        schema:
          type: array
          items:
            type: integer
            enum:
            - 0
            - 1
            - 2
            - 3
            description: 0 INCOMPLETE · 1 STARTED · 2 COMPLETED (awaiting payment) · 3 FINISHED (D-VIS-07/09)
            x-enum-varnames:
            - INCOMPLETE
            - STARTED
            - COMPLETED
            - FINISHED
        description: Repeatable
        style: form
        explode: true
      - name: is_late_entry
        in: query
        schema:
          type: boolean
      - name: proxy
        in: query
        schema:
          type: boolean
        description: true = proxy_reason is set
      - name: location_type
        in: query
        schema:
          type: integer
          enum:
          - 1
          - 2
          description: 1 BRANCH (shop) · 2 HOME (D-SVC-06)
          x-enum-varnames:
          - BRANCH
          - HOME
      - name: booking_id
        in: query
        schema:
          type: string
          format: uuid
      - name: awaiting_payment
        in: query
        schema:
          type: boolean
        description: true = COMPLETED visits whose sale is still OPEN (the "Awaiting payment" filter)
      - name: q
        in: query
        schema:
          type: string
        description: Receipt number or customer name / phone
      - name: sort
        in: query
        schema:
          type: string
          enum:
          - -started_at
          - started_at
          default: -started_at
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/VisitListItem'
                  next_cursor:
                    type:
                    - string
                    - 'null'
                  total:
                    type:
                    - integer
                    - 'null'
                required:
                - items
                - next_cursor
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
      - visits
      operationId: visitStart
      summary: START a visit — walk-in, from a booking, proxy, home, late entry (P4.VIS.03) — P4-RULE-02
      x-permission: any staff (read scope — branch must be in the caller read scope; own work / proxy need no code — D-VIS-04/12) · late_entry → sale.late_entry (branch data)
      description: 'Creates the visit (STARTED) and its OPEN sale in one transaction (F-P4-01). Lock order: DayLock, then (late entry) PayrollLock, then the booking row. Late entry into
        a FINALIZED / PUBLISHED / PAID payroll period → 423 payroll_finalized (correction = manual payroll line — owner B9); late_entry.started_at is required. booking_id → booking row
        locked FOR UPDATE, must be BOOKED (else 409 invalid_transition with context.visit_id) → booking STARTED (P3-RULE-09). 422 unpaid_visit_open { visit_id } when the performer has
        a COMPLETED, not-late-entry visit still unpaid (owner B1) · 422 day_closed (DayLock — Part 7) · 422 not_assigned_to_branch · 422 booking_not_today · 400 reason_required (proxy
        / performer change / late entry OTHER). Identifying fields for idempotency_mismatch: branch_id, booking_id, performed_by_employee_id.'
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/XRequestedWith'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartVisitRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Visit'
        '200':
          description: Idempotent replay (same Idempotency-Key, same identifying fields)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Visit'
          headers:
            Idempotent-Replayed:
              schema:
                type: boolean
              description: true on a replay of the same Idempotency-Key (API-IDEM-02)
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '423':
          $ref: '#/components/responses/Locked'
  /me/visits:
    get:
      tags:
      - visits
      operationId: myVisits
      summary: My visits — Today screen (P4.VIS.02) — AD-TODAY-01/02
      x-permission: self (performer or recorder)
      parameters:
      - name: status
        in: query
        schema:
          type: array
          items:
            type: integer
            enum:
            - 0
            - 1
            - 2
            - 3
            description: 0 INCOMPLETE · 1 STARTED · 2 COMPLETED (awaiting payment) · 3 FINISHED (D-VIS-07/09)
            x-enum-varnames:
            - INCOMPLETE
            - STARTED
            - COMPLETED
            - FINISHED
        description: Repeatable; default 1, 2 (open) plus today's 0 and 3
        style: form
        explode: true
      - name: date
        in: query
        schema:
          type: string
          format: date
        description: Default today (MMT)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Visit'
                required:
                - items
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /visits/{id}:
    get:
      tags:
      - visits
      operationId: visitGet
      summary: Visit detail with its sale (P4.VIS.04) — AD-POS-04
      x-permission: self (performer · recorder) | visit.view+ (branch data)
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Visit'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /visits/{id}/complete:
    post:
      tags:
      - visits
      operationId: visitComplete
      summary: '"Service done" — COMPLETE (P4.VIS.05) — D-VIS-02/03'
      x-permission: self (performer · recorder of the visit) | visit.update (branch data)
      description: 'STARTED only (else 409 invalid_transition; already COMPLETED → 200 current state). ≥ 1 active SERVICE line (422 service_required). completed_at = now; late-entry
        visit: completed_at is required in the body (400 validation) = the entered time (≥ started_at, ≤ now — 422 late_entry_time).'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/XRequestedWith'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Visit'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /visits/{id}/incomplete:
    post:
      tags:
      - visits
      operationId: visitIncomplete
      summary: Mark incomplete (P4.VIS.06) — D-VIS-09, AD-POS-04
      x-permission: self (performer · recorder of a PHONE_UNAVAILABLE proxy visit) | visit.delete (branch data — cancel, record kept)
      description: STARTED / COMPLETED with an OPEN sale. 422 payments_exist when non-voided payments remain (void them first — P4.PAY.03). Sale → CANCELLED, pending discount request
        → CANCELLED, booking → COMPLETED (F-P4-13). No receipt number, no revenue, no commission.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/XRequestedWith'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReasonBody'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Visit'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /sales:
    get:
      tags:
      - sales
      operationId: saleList
      summary: Sales list (P4.SAL.01) — Sales menu
      x-permission: sale.view+ (branch data — scope-filtered)
      parameters:
      - name: branch_id
        in: query
        schema:
          type: string
          format: uuid
      - name: from
        in: query
        schema:
          type: string
          format: date
        description: Business date (FINISH date for finished sales; START date otherwise); default today
      - name: to
        in: query
        schema:
          type: string
          format: date
      - name: status
        in: query
        schema:
          type: array
          items:
            type: integer
            enum:
            - 0
            - 1
            - 2
            description: 0 CANCELLED · 1 OPEN · 2 FINISHED (immutable — D-VIS-08)
            x-enum-varnames:
            - CANCELLED
            - OPEN
            - FINISHED
        description: Repeatable; default 2
        style: form
        explode: true
      - name: performed_by_employee_id
        in: query
        schema:
          type: string
          format: uuid
      - name: collected_by_employee_id
        in: query
        schema:
          type: string
          format: uuid
      - name: customer_id
        in: query
        schema:
          type: string
          format: uuid
      - name: payment_method_id
        in: query
        schema:
          type: string
          format: uuid
      - name: has_discount
        in: query
        schema:
          type: boolean
      - name: has_refund
        in: query
        schema:
          type: boolean
      - name: price_overridden
        in: query
        schema:
          type: boolean
      - name: kind
        in: query
        schema:
          type: string
          enum:
          - service
          - product_only
          - difference
      - name: q
        in: query
        schema:
          type: string
        description: Receipt number (exact or prefix) or customer name / phone
      - name: sort
        in: query
        schema:
          type: string
          enum:
          - -finished_at
          - finished_at
          - -total_amount
          default: -finished_at
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/SaleListItem'
                  next_cursor:
                    type:
                    - string
                    - 'null'
                  total:
                    type:
                    - integer
                    - 'null'
                required:
                - items
                - next_cursor
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
      - sales
      operationId: saleCreateProductOnly
      summary: Product-only sale (P4.SAL.03) — D-PAY-03
      x-permission: sale.create (branch data)
      description: 'OPEN sale without a visit; lines = PRODUCT only (late entry ⏭ — F-P4-09). DayLock on today (422 day_closed). Identifying fields: branch_id.'
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/XRequestedWith'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductSaleCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sale'
        '200':
          description: Idempotent replay (same Idempotency-Key, same identifying fields)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sale'
          headers:
            Idempotent-Replayed:
              schema:
                type: boolean
              description: true on a replay of the same Idempotency-Key (API-IDEM-02)
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /sales/{id}:
    get:
      tags:
      - sales
      operationId: saleGet
      summary: Sale detail — lines, discount, payments, totals, refunds, adjustments (P4.SAL.02)
      x-permission: self (performer of a line · visit recorder · creator · finisher) | sale.view+ (branch data)
      description: Effective values (after sale_adjustments — P4-RULE-15) are returned next to the stored ones. commission_estimate only for the performer whose effective own-earnings
        flag is ON (D-COM-04, D-DSH-03).
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sale'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /sales/{id}/items:
    post:
      tags:
      - sales
      operationId: saleItemAdd
      summary: Add a service or product line (P4.SAL.04) — AD-POS-04/05
      x-permission: self (performer · recorder of the visit · creator of a visit-less sale) | visit.update (branch data — also the lines of someone else's OPEN product-only sale)
      description: 'OPEN sale (FINISHED → 409 invalid_transition with context.correction_path; CANCELLED → 409 invalid_transition without it — v1.1). A difference sale holds exactly the line P4.SAL.13 wrote: any line write on
        it → 422 difference_line_type. SERVICE → needs a visit, priced by the Part 2 quote on the visit business date (P4-RULE-05); HOME → the performer must be home-eligible (422 not_eligible).
        PRODUCT → is_sellable, ACTIVE; list price = products.sell_price_amount. added_reason required for a service not in the booking, or any service added after COMPLETE (D-VIS-05).
        Item codes: not_sold_here · variant_required · service_inactive · category_inactive · product_not_sellable. Negative stock → warnings[] (never blocks — D-STK).'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/XRequestedWith'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaleItemCreate'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sale'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /sales/{id}/items/{item_id}:
    patch:
      tags:
      - sales
      operationId: saleItemUpdate
      summary: Change option (variant) or product quantity (P4.SAL.05) — D-SVC-05
      x-permission: self (performer · recorder of the visit · creator of a visit-less sale) | visit.update (branch data — also the lines of someone else's OPEN product-only sale)
      description: 'Variant change re-prices from the quote (an override on the line is cleared). Booking-origin line → reason required (stored in the audit row). Quantity: PRODUCT only.
        Difference sale → 422 difference_line_type.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: item_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/XRequestedWith'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaleItemUpdate'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sale'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /sales/{id}/items/{item_id}/remove:
    post:
      tags:
      - sales
      operationId: saleItemRemove
      summary: Remove a line — kept, struck through (P4.SAL.06) — D-VIS-05
      x-permission: self (performer · recorder of the visit · creator of a visit-less sale) | visit.update (branch data — also the lines of someone else's OPEN product-only sale)
      description: OPEN sale. The TRANSPORT_FEE line cannot be removed (422 transport_line_locked — reduce it with a price override). Removing the last SERVICE line of a COMPLETED visit
        → 422 service_required. Difference sale → 422 difference_line_type.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: item_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/XRequestedWith'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReasonBody'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sale'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /sales/{id}/items/{item_id}/price:
    post:
      tags:
      - sales
      operationId: saleItemPriceOverride
