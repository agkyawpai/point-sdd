    post:
      tags:
      - sales
      operationId: saleDifferenceCreate
      summary: Undercharge — new "difference sale" for the original barber (P4.SAL.13) — owner B10
      x-permission: sale.adjust (branch data)
      description: 'Created when the customer is paying the difference (same day or a later visit): a normal OPEN visit-less sale that must be FINISHED or cancelled before the day closes
        (owner E2); DayLock on today (422 day_closed). Original sale FINISHED; line = SERVICE or TRANSPORT_FEE of it (422 difference_line_type — a difference sale never moves stock).
        One line with the original line_type (SERVICE: same service / variant, performer = the original line''s effective performer; TRANSPORT_FEE: no performer), list = unit = amount,
        description "Difference for <receipt> — <line>". Link = a type 9 adjustment on the ORIGINAL sale whose reason starts with difference_sale:<new sale id>:<original sale_item_id>
        (no DB column — P4-RULE-12) → Sale.difference_of / SaleAdjustment.difference_sale_id. Checkout actors: the creator, that performer, sale.finish_override holders. Idempotency
        = the new sale''s client_request_id; identifying fields: original sale, sale_item_id, amount.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/XRequestedWith'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DifferenceSaleRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sale'
        '200':
          description: Idempotent replay (same Idempotency-Key, same identifying fields)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sale'
          headers:
            Idempotent-Replayed:
              schema:
                type: boolean
              description: true on a replay of the same Idempotency-Key (API-IDEM-02)
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
