      x-permission: sale.refund (branch data — the sale branch)
      description: 'FINISHED sale (409 invalid_transition). Refund branch = the sale branch (owner B8 b). Any ACTIVE method (owner B8 c; reference rules as payments). Kind 1 (sale refund):
        per line amount ≤ the line net remaining and Σ kind-1 refunds ≤ the sale total (422 refund_exceeds_remaining { sale_item_id, remaining_amount }), product lines back_to_stock
        (owner B8 a → Part 6 StockLedger.post: SALE_RETURN_IN; false = also MANUAL_ADJUST −qty with the stock.refund_damaged_reason_id reason, note = RF number). Kind 2 (overpayment
        return — the automatic change at FINISH = paid − total needs no code; a manual return = a duplicate transfer never recorded as a payment): amount, reason and external_reference
        required, no items; each manual return ≤ max(sale total, Σ non-voided non-cash payments of the sale) (422 refund_exceeds_remaining with sale_item_id null); kind-2 returns do
        not consume the kind-1 cap (D-PAY-05). Missing items (kind 1) / amount (kind 2) → 400 validation. Refund references are not checked for uniqueness. RF number from receipt_counters
        kind 2; refund business_date = today (DayLock first — 422 day_closed). Identifying fields: sale_id, kind, amount.'
