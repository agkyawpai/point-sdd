              schema:
                $ref: '#/components/schemas/Refund'
        '200':
          description: Idempotent replay (same Idempotency-Key, same identifying fields)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Refund'
          headers:
            Idempotent-Replayed:
              schema:
                type: boolean
              description: true on a replay of the same Idempotency-Key (API-IDEM-02)
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
